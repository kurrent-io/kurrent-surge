edition = "2023";

package kurrentdb.protocol.v2.indexes.errors;

option csharp_namespace = "KurrentDB.Protocol.V2.Indexes.Errors";

import "kurrent/rpc/rpc.proto";

// Error codes for index operations.
//
// These errors are returned by the IndexesService and indicate specific
// failure conditions. Each error includes an HTTP status code mapping.
enum IndexesError {
  // Default value.
  //
  // This value is not used. An error code MUST always be set to a non-zero
  // value. If an error code is not explicitly set, it MUST be treated as
  // an internal server error (HTTP 500).
  INDEXES_ERROR_UNSPECIFIED = 0;

  // The requested index does not exist.
  //
  // Returned when attempting to get, start, stop, or delete an index that
  // is not found in the cluster. HTTP 404.
  INDEXES_ERROR_INDEX_NOT_FOUND = 1 [(kurrent.rpc.error) = {
    status_code: NOT_FOUND,
    has_details: true,
  }];

  // The requested index already exists.
  //
  // Returned when attempting to create an index with a name that is already
  // in use. HTTP 409.
  INDEXES_ERROR_INDEX_ALREADY_EXISTS = 2 [(kurrent.rpc.error) = {
    status_code: ALREADY_EXISTS,
    has_details: true,
  }];

  // The index engine is not yet ready.
  //
  // The index was created or started but is still catching up to the event
  // log. Queries may be made after ready, or clients should retry with
  // exponential backoff. The error details include current and target positions
  // to estimate catch-up progress. HTTP 412.
  INDEXES_ERROR_INDEXES_NOT_READY = 3 [(kurrent.rpc.error) = {
    status_code: FAILED_PRECONDITION,
    has_details: true,
  }];

  // Secondary indexing is disabled.
  //
  // Returned when attempting to create or manage indexes while the cluster
  // has secondary indexing disabled. Check cluster configuration. HTTP 412.
  INDEXES_ERROR_SECONDARY_INDEXING_DISABLED = 4 [(kurrent.rpc.error) = {
    status_code: FAILED_PRECONDITION,
  }];
}

// Details for INDEXES_ERROR_INDEX_NOT_FOUND errors.
message IndexNotFoundErrorDetails {
  // The index name that was not found.
  string name = 1;
}

// Details for INDEXES_ERROR_INDEX_ALREADY_EXISTS errors.
message IndexAlreadyExistsErrorDetails {
  // The index name that already exists.
  string name = 1;
}

// Details for INDEXES_ERROR_INDEXES_NOT_READY errors.
//
// Includes current and target event log positions to allow clients to estimate
// how far the index must catch up before it becomes queryable.
message IndexesNotReadyErrorDetails {
  // Current event log position that the index has processed.
  int64 current_position = 1;

  // Target event log position the index must reach.
  int64 target_position = 2;
}
