edition = "2023";

package kurrentdb.protocol.v2.indexes;

option csharp_namespace = "KurrentDB.Protocol.V2.Indexes";

import "kurrentdb/protocol/v2/indexes/shared.proto";

// Request to list all indexes in the cluster.
message ListIndexesRequest {}

// Response containing all indexes.
message ListIndexesResponse {
  // All indexes in the cluster.
  repeated Index indexes = 1;
}

// Request to retrieve a specific index.
message GetIndexRequest {
  // The index name.
  string name = 1;
}

// Response containing index details.
message GetIndexResponse {
  // The requested index.
  Index index = 1;
}

// Metadata for an index.
//
// An index consists of a filter (to determine which records to include) and
// one or more fields (to extract values for indexing and querying).
message Index {
  // The index name. Unique within the cluster.
  string name = 1;

  // JavaScript function determining which records qualify for indexing.
  // Example: "rec => rec.schema.name == 'OrderCreated'"
  string filter = 2;

  // Fields to extract from matching records.
  repeated IndexField fields = 3;

  // Current state of the index (STARTED, STOPPED, or DELETED).
  IndexState state = 4;
}
