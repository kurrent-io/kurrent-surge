edition = "2023";

package kurrentdb.protocol.v2.indexes;

option csharp_namespace = "KurrentDB.Protocol.V2.Indexes";

import "kurrentdb/protocol/v2/indexes/shared.proto";

// Request to create a new index.
//
// The index will process existing records and new incoming records based on the
// provided filter and field selectors. If `start` is unspecified, the index starts
// immediately.
message CreateIndexRequest {
  // The index name. Must be unique within the cluster.
  string name = 1;

  // JavaScript function determining which records to index.
  // Example: "rec => rec.schema.name == 'OrderCreated'"
  string filter = 2;

  reserved 3;  // filter type

  // Fields to extract and index from matching records.
  repeated IndexField fields = 4;

  // Whether to start the index immediately after creation.
  //
  // Default: true (index will be in STARTED state).
  // If false, the index will be in STOPPED state until explicitly started.
  bool start = 5 [default = true];
}

// Response to a successful index creation.
message CreateIndexResponse {}

// Request to start an index.
//
// Transitions the index from STOPPED to STARTED state. The index will resume
// processing records and remain available for queries.
message StartIndexRequest {
  // The index name.
  string name = 1;
}

// Response to a successful index start.
message StartIndexResponse {}

// Request to stop an index.
//
// Transitions the index from STARTED to STOPPED state. The index will pause
// processing new records but existing data remains accessible for queries.
message StopIndexRequest {
  // The index name.
  string name = 1;
}

// Response to a successful index stop.
message StopIndexResponse {}

// Request to delete an index.
//
// Permanently removes the index and cleans up all associated data. This operation
// cannot be undone. The index transitions to DELETED state.
message DeleteIndexRequest {
  // The index name.
  string name = 1;
}

// Response to a successful index deletion.
message DeleteIndexResponse {}
