//
//// Initial position at which the cursor will be set when subscribing.
////
//// Only used when:
//// - Processor is created for the first time (no checkpoint exists)
//// - All checkpoints have been deleted
////
//// Once a checkpoint exists, the processor always resumes from the last
//// checkpoint position, ignoring this setting.
//enum InitialPosition {
//  INITIAL_POSITION_UNSPECIFIED = 0;
//
//  // Start from current end of log (new records only).
//  //
//  // The processor will only see records written AFTER it starts.
//  // Historical data is ignored.
//  //
//  // Use when: You only care about new events, not historical data.
//  INITIAL_POSITION_LATEST = 1;
//
//  // Start from beginning of log (all records).
//  //
//  // The processor will receive all historical records before
//  // transitioning to live processing (triggers `CAUGHT_UP`).
//  //
//  // Use when: You need to process/replay all historical data.
//  INITIAL_POSITION_EARLIEST = 2;
//}
//
//// What happens when a checkpoint fails.
////
//// A checkpoint fails if any worker doesn't acknowledge within the timeout.
//// The timed-out worker is always disconnected regardless of this policy.
//// This setting controls what happens to the OTHER workers.
//enum CheckpointFailurePolicy {
//  CHECKPOINT_FAILURE_POLICY_UNSPECIFIED = 0;
//
//  // Abort this checkpoint, continue processing.
//  //
//  // - The checkpoint is marked as failed
//  // - Other workers continue processing from last successful checkpoint
//  // - Failed worker's partitions are reassigned to remaining workers
//  // - Next checkpoint triggers normally on interval/threshold
//  //
//  // Use when: High availability is priority, some data loss acceptable.
//  CHECKPOINT_FAILURE_POLICY_CONTINUE = 1;
//
//  // Stop all processing on checkpoint failure.
//  //
//  // - All workers are disconnected
//  // - Processor goes to `IDLE` state
//  // - Requires manual intervention (reconnect workers to resume)
//  //
//  // Use when: Data consistency is critical, prefer downtime over data loss.
//  CHECKPOINT_FAILURE_POLICY_FAIL_PROCESSOR = 2;
//}
//
//// What triggered a checkpoint.
////
//// Checkpoints can be triggered automatically by the server or manually by the user.
//// The trigger is recorded with the checkpoint for diagnostics and auditing.
//enum CheckpointTrigger {
//  CHECKPOINT_TRIGGER_UNSPECIFIED = 0;
//
//  // Time interval elapsed since last checkpoint.
//  //
//  // Triggered automatically by the server based on `CheckpointSettings.interval_ms`.
//  // This is the primary mechanism for regular checkpointing.
//  //
//  // Frequency: Periodic (every `interval_ms` milliseconds).
//  // Auto-deleted: Yes (subject to `retention_count`).
//  CHECKPOINT_TRIGGER_INTERVAL = 1;
//
//  // Record count threshold reached.
//  //
//  // Triggered when `CheckpointSettings.threshold` records have been processed
//  // since the last checkpoint. Useful for high-throughput scenarios where
//  // time-based intervals alone might result in too much data between checkpoints.
//  //
//  // Frequency: Periodic (every N records).
//  // Auto-deleted: Yes (subject to `retention_count`).
//  CHECKPOINT_TRIGGER_THRESHOLD = 2;
//
//  // Subscription caught up to end of log, transitioning to live mode.
//  //
//  // Triggered exactly ONCE per processor lifecycle when the subscription
//  // finishes processing historical data and transitions to receiving live
//  // records. Only fires if the subscription started before the stream end
//  // (i.e., had historical data to process).
//  //
//  // This ensures that after processing a potentially large historical backlog,
//  // the state is checkpointed before live processing begins. Prevents replaying
//  // the entire history if the worker crashes shortly after going live.
//  //
//  // Frequency: Once per processor lifecycle (at catch-up completion).
//  // Auto-deleted: Yes (subject to `retention_count`).
//  CHECKPOINT_TRIGGER_CAUGHT_UP = 3;
//
//  // Worker membership changed, checkpoint before rebalancing.
//  //
//  // Triggered when workers connect or disconnect, before partitions are
//  // redistributed. Ensures consistent state before partition ownership changes.
//  //
//  // The checkpoint captures state at the moment before rebalancing starts,
//  // so that:
//  // - Workers losing partitions have checkpointed their progress
//  // - Workers gaining partitions can restore from a known-good state
//  //
//  // Frequency: On each worker connect/disconnect.
//  // Auto-deleted: Yes (subject to `retention_count`).
//  CHECKPOINT_TRIGGER_REBALANCE = 4;
//
//  // User-triggered savepoint via `TriggerSavepoint` RPC.
//  //
//  // Savepoints are manually triggered checkpoints that are NEVER auto-deleted,
//  // regardless of `retention_count`. They persist until explicitly deleted by
//  // the user via `DeleteCheckpoint`.
//  //
//  // Use cases:
//  // - Before deploying new processor code (safe rollback point)
//  // - Before schema migrations
//  // - Creating restore points for disaster recovery
//  // - Cloning processor state to a new processor
//  //
//  // Frequency: On demand (user-initiated).
//  // Auto-deleted: NO (persists until explicitly deleted).
//  CHECKPOINT_TRIGGER_SAVEPOINT = 5;
//}
