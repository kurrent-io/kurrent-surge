//// =============================================================================
//// WORKER → SERVER MESSAGES
//// =============================================================================
//
//// Messages sent from worker to server over the bidirectional stream.
////
//// Message flow:
//// 1. `Connect`            - Initiate session, join processor
//// 2. `WorkAccepted`       - Signal readiness after receiving `WorkAssigned`
//// 3. `CheckpointComplete` - Acknowledge checkpoint after uploading state
//// 4. `Disconnect`         - Graceful shutdown request
//message WorkerMessage {
//  oneof message {
//    // Initiate a processing session.
//    Connect connect = 1;
//
//    // End session gracefully.
//    Disconnect disconnect = 2;
//
//    // Accept work assignment and signal readiness.
//    WorkAccepted work_accepted = 3;
//
//    // Acknowledge checkpoint completion.
//    CheckpointComplete checkpoint_complete = 4;
//  }
//}
//
//// Initiate a processing session.
//message Connect {
//  // Processor identifier. Workers with the same ID share work.
//  string processor_id = 1;
//
//  // Unique identifier for this worker instance.
//  string worker_id = 2;
//
//  // Processor settings.
//  // Creates the processor if it doesn't exist.
//  // Validated against existing settings on subsequent connects.
//  ProcessorSettings settings = 3;
//}
//
//// End session gracefully.
//// Triggers a coordinated checkpoint before disconnection.
//message Disconnect {
//  DisconnectReason reason = 1;
//}
//
//enum DisconnectReason {
//  DISCONNECT_REASON_UNSPECIFIED = 0;
//
//  // Graceful shutdown (deployment, scaling down).
//  DISCONNECT_REASON_SHUTDOWN = 1;
//
//  // Worker encountered an error.
//  DISCONNECT_REASON_ERROR = 2;
//}
//
//// Worker accepts the work assignment and is ready to receive records.
//// Send after receiving `WorkAssigned` and completing any state recovery.
//message WorkAccepted {}
//
//// Acknowledge checkpoint completion.
