//// =============================================================================
//// SERVER → WORKER MESSAGES
//// =============================================================================
//
//// Messages sent from server to worker over the bidirectional stream.
////
//// Message flow:
//// 1. `WorkAssigned`       - Assign partitions (after `Connect` or during rebalance)
//// 2. `Records`            - Deliver record batches for processing
//// 3. `CheckpointBarrier`  - Request checkpoint snapshot
//// 4. `Disconnected`       - Session terminated (graceful or error)
//message ServerMessage {
//  oneof message {
//    // Partition assignment (initial or rebalance).
//    WorkAssigned work_assigned = 1;
//
//    // Session terminated.
//    Disconnected disconnected = 2;
//
//    // Batch of records to process.
//    kurrentdb.protocol.v2.streams.Records records = 3;
//
//    // Checkpoint trigger.
//    CheckpointBarrier checkpoint_barrier = 4;
//  }
//}
//
//// Session terminated.
//message Disconnected {
//  // Why the session was terminated.
//  DisconnectedReason reason = 1;
//
//  // Human-readable message with additional details.
//  string message = 2;
//}
//
//// Reason for session termination (server → worker).
//enum DisconnectedReason {
//  DISCONNECTED_REASON_UNSPECIFIED = 0;
//
//  // Worker requested disconnection (graceful).
//  DISCONNECTED_REASON_REQUESTED = 1;
//
//  // Server is shutting down.
//  DISCONNECTED_REASON_SERVER_SHUTDOWN = 2;
//
//  // Worker didn't acknowledge checkpoint in time.
//  DISCONNECTED_REASON_CHECKPOINT_TIMEOUT = 3;
//
//  // Protocol or processing error.
//  DISCONNECTED_REASON_ERROR = 4;
//}
//
//// Checkpoint trigger.
//// Worker must snapshot state, upload via `UploadCheckpoint` RPC, then send `CheckpointComplete`.
//message CheckpointBarrier {
//  // Checkpoint identifier (log position at barrier).
//  int64 checkpoint_id = 1;
//
//  // What triggered this checkpoint.
//  CheckpointTrigger trigger = 2;
//}
//
//// Work assignment for this worker.
////
//// Sent in two scenarios:
//// 1. After `Connect`: Initial work assignment
//// 2. During rebalancing: When workers join or leave, partitions are redistributed
////
//// The worker should:
//// 1. Compare with previous assignment to determine gained/lost partitions
//// 2. Download state for newly assigned partitions (if `checkpoint_id` present)
//// 3. Send `WorkAccepted` when ready to receive records
//message WorkAssigned {
//  // The partitions this worker is now responsible for.
//  // When `max_parallelism` = 1, single worker receives partition `[0]`.
//  repeated int32 partitions = 1;
//
//  // Checkpoint to restore state from for assigned partitions.
//  // Worker should call `DownloadCheckpoint` RPC with this ID.
//  // Absent if this is a new processor with no checkpoint.
//  int64 checkpoint_id = 2;
//}
//
//// =============================================================================
//// CHECKPOINT STATE TRANSFER
//// =============================================================================
//
//// Range of partitions (inclusive).
//// E.g., `start=0`, `end=127` represents partitions 0 to 127 inclusive.
//message PartitionRange {
//  // First partition in range (inclusive).
//  int32 start = 1;
//
//  // Last partition in range (inclusive).
//  int32 end = 2;
//}
//
//// Snapshot of state for a range of partitions.
//message CheckpointSnapshot {
//  // Partition range covered by this snapshot blob.
//  PartitionRange partition_range = 1;
//
//  // Actual state blob (e.g., Parquet file, potentially compressed).
//  bytes state = 2;
//
//  // Optional metadata (compression, format, timing, etc.).
//  map<string, string> metadata = 3;
//}
//
//// Upload state snapshot for a checkpoint.
//// Worker uploads a single blob covering all partitions it owns.
//message UploadCheckpointRequest {
//  // The processor identifier.
//  string processor_id = 1;
//
//  // The worker identifier.
//  string worker_id = 2;
//
//  // The checkpoint identifier (from `CheckpointBarrier`).
//  int64 checkpoint_id = 3;
//
//  // The state snapshot to upload.
//  CheckpointSnapshot snapshot = 4;
//
//  // Whether this checkpoint was triggered as a savepoint.
//  bool savepoint = 5;
//}
//
//// Response to `UploadCheckpointRequest`. Empty on success.
//message UploadCheckpointResponse {}
//
//// Download state snapshot for specific partitions.
//// Server merges/filters stored snapshots to return exactly the requested range.
//message DownloadCheckpointRequest {
//  // The processor identifier.
//  string processor_id = 1;
//
//  // The worker identifier.
//  string worker_id = 2;
//
//  // The checkpoint identifier (from `WorkAssigned`).
//  int64 checkpoint_id = 3;
//
//  // The partition range to download.
//  PartitionRange partition_range = 4;
//}
//
//// Response containing the requested state snapshot.
//message DownloadCheckpointResponse {
//  // The state snapshot for the requested partition range.
//  CheckpointSnapshot snapshot = 1;
//}
