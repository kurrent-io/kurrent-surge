//
//// The filter to apply when reading records.
//// the expression uses a sql compatible dialect with some limitations.
//// it supports:
//// - logical operators (and, or, not)
//// - comparison operators (=, ==, !=, <>, <, >, <=, >=, ~, ~*, !~, !~*)
//// - set operators (in, not in, is null, is not null)
//// and parentheses for grouping.
////
//// The expression can reference the following fields:
//// - record.id  | rec.id | record_id | id
//// - record.position | rec.pos | position | pos
//// - record.timestamp | rec.ts | timestamp | ts
//// - record.stream | rec.stream | stream
//// - record.stream.revision | rec.stream.rev | stream_revision | stream_rev | revision | rev
//// - record.schema | rec.schema | schema
//// - record.schema.version-id | rec.schema.id | schema_id
//// - record.schema.data-format | rec.schema.format | schema_format
//// - record.data | rec.data | data  (only for json and avro data formats)
//// - record.properties | rec.props | properties | props (only for json and avro data formats)
//
//// - record_id | rec_id
//// - position  | pos
//// - timestamp | ts
////
//// - stream.name     | stream
//// - stream.revision | stream_rev
////
//// - schema.name | schema
//// - schema.id | schema_id
//// - schema.format | schema_format
////
//// - data (only for json and avro data formats)
//// - properties | props (only for json and avro data formats)
//
//// we need to add rec. prefix to safeguard against the future possibility of
//// allowing more queries agains different sources, not only records... not 100% sure about this...
//
////
//// Examples:
//// from '$all' where record.stream == 'mystream' and record.schema == 'messages.v1.message_created'
//// from '$all' where record.schema in ('orders.v1.order_created', 'orders.v1.order_fulfilled')
//// from '$all' where record.schema.version-id is null
//// from 'orders-003' where rec.schema = 'orders.v1.order_fulfilled'
//// from '$all' where rec.stream ~* '^(orders|payments)' and rec.data.customer_id = 'C12345' and record.data.date >= '2023-01-01'
//
//// from '$all' where stream == 'mystream' and schema == 'messages.v1.message_created'
//// from '$all' where schema in ('orders.v1.order_created', 'orders.v1.order_fulfilled')
//// from '$all' where schema_id is null
//// from 'orders-003' where schema = 'orders.v1.order_fulfilled'
//// from '$all' where stream ~* '^(orders|payments)' and data.customer_id = 'C12345' and data.date >= '2023-01-01'
//// from '$all' where props.priority >= 100 and props.source = 'sensor-A'
//
//
//
//// The filter to apply when reading records from the database
//// The combination of stream scope and literal expression indicates a direct stream name match,
//// while a regex expression indicates a pattern match across multiple streams.
//message RecordFilter {
//  // The scope of the filter.
//  RecordFilterScope scope = 1;
//  // The expression can be a regular expression or a literal value.
//  // If it starts with "~" it will be considered a regex.
//
//  // If it starts with "+" it will be considered a regex.
//  string expression = 2;
//}
//
