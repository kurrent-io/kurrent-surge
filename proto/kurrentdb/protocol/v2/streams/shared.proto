edition = "2023";

package kurrentdb.protocol.v2.streams;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "KurrentDB.Protocol.V2.Streams";

/**
 * A record in the database.
 */
message Record {
  // Unique identifier for this record.
  string record_id = 1;

  // Position in the global log.
  int64 position = 2;

  // Schema information for interpreting the record data.
  SchemaInfo schema = 3;

  // The record payload as raw bytes.
  // The format specified in SchemaInfo determines how to interpret these bytes.
  bytes data = 4;

  // A collection of properties providing additional information about the
  // record. Can contain user-defined or system propreties.
  // System keys will be prefixed with "$" (e.g., "$timestamp").
  // User-defined keys MUST NOT start with "$".
  //
  // Common examples:
  //   User metadata:
  //     - "user-id": "12345"
  //     - "tenant": "acme-corp"
  //     - "source": "mobile-app"
  //
  //   System metadata (with $ prefix):
  //     - "$trace-id": "4bf92f3577b34da6a3ce929d0e0e4736"  // OpenTelemetry trace ID
  //     - "$span-id": "00f067aa0ba902b7"                   // OpenTelemetry span ID
  //     - "$timestamp": "2025-01-15T10:30:00.000Z"         // ISO 8601 timestamp

  map<string, google.protobuf.Value> properties = 5;

  // When the record was created.
  google.protobuf.Timestamp create_time = 6;

  // Stream the record belongs to.
  string stream = 7;

  // Revision of the stream after this record was appended.
  sint64 stream_revision = 8;

  // Partition of the stream, if applicable.
  sint64 stream_partition = 9;
}

message StreamInfo {
  // Stream name.
  string name = 1;

  // Revision of the stream after this record was appended.
  sint64 stream_revision = 2;

  // Partition of the stream, if applicable.
  sint64 stream_partition = 3;

  // When the stream was created.
  google.protobuf.Timestamp create_time = 4;
}

// Batch of records.
message Records {
  repeated Record records = 1;
}

// Data format of a schema.
enum SchemaFormat {
  SCHEMA_FORMAT_UNSPECIFIED = 0;
  SCHEMA_FORMAT_JSON        = 1;
  SCHEMA_FORMAT_PROTOBUF    = 2;
  SCHEMA_FORMAT_AVRO        = 3;
  SCHEMA_FORMAT_BYTES       = 4;
}

/**
 * Schema information for record payload interpretation and validation.
 */
message SchemaInfo {
  // Format of the record data.
  // Required for interpreting the bytes in Record.data. Determines how to parse and validate the record payload.
  SchemaFormat format = 1 [default = SCHEMA_FORMAT_UNSPECIFIED];

  // Schema name identifying the record type (e.g., "order-placed", "customer-registered").
  string name = 2;

  // Version identifier of the schema that the record conforms to.
  string id = 3;
}

/**
 * A specific revision of a stream.
 *
 * Used to represent stream positions for checkpoints, consistency checks,
 * and head position tracking.
 */
message StreamRevision {
  // Stream name.
  string stream = 1;

  // Revision within the stream.
  sint64 revision = 2;
}

/**
 * A position in the log, which can be specified either as a global log position
 * or as a stream-specific revision.
 *
 * Used for checkpoints, head positions, and start positions in processing.
 * The position uniquely identifies a record or a processing checkpoint.
 */
message RecordPosition {
  oneof kind {
    // Global log position (position in $all).
    int64 log_position = 1;

    // Stream-specific position.
    StreamRevision stream_revision = 2;
  }
}


//// Configuration for progress heartbeats during filtered reads.
////
//// Heartbeats provide progress visibility when a filter excludes records.
//// Without heartbeats, a worker processing a filter that matches few
//// records would have no way to know its actual position in the log.
////
//// Heartbeats report the current log position even when no records
//// are delivered, allowing workers to:
//// - Track progress through the log
//// - Detect when caught up to the head
//// - Confirm the connection is alive during quiet periods
////
//// Useful when:
//// - Filter uses predicates that exclude most records
//// - Low-traffic scenarios where liveness confirmation is needed
////
//// Less useful when:
//// - No filter is set (every record provides position information)
//// - Filter selects a single stream (stream head is known)
