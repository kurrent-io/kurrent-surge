edition = "2023";

package kurrentdb.protocol.v2.streams;

option csharp_namespace = "KurrentDB.Protocol.V2.Streams";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "kurrent/rpc/rpc.proto";

import "kurrentdb/protocol/v2/streams/shared.proto";

service StreamsService {
  // Appends records to multiple streams atomically within a single transaction.
  //
  // This is a client-streaming RPC where the client sends multiple AppendRequest messages
  // (one per stream) and receives a single AppendSessionResponse upon commit.
  //
  // Guarantees:
  // - Atomicity: All writes succeed or all fail together
  // - Optimistic Concurrency: Expected revisions are validated for all streams before commit
  // - Ordering: Records within each stream maintain send order
  //
  // Current Limitations:
  // - Each stream can only appear once per session (no multiple appends to same stream)
  //
  // Example flow:
  //   1. Client opens stream
  //   2. Client sends AppendRequest for stream "orders" with 3 records
  //   3. Client sends AppendRequest for stream "inventory" with 2 records
  //   4. Client completes the stream
  //   5. Server validates, commits, returns AppendSessionResponse with positions
  //
  // Common errors (automatically apply to all operations):
  // - UNAUTHENTICATED: No valid authentication credentials
  // - ACCESS_DENIED: User lacks write permission
  // - NOT_LEADER_NODE: Server is not the cluster leader
  // - INTERNAL: Internal server error
  // - UNAVAILABLE: Service unavailable
  // - BAD_REQUEST: Request contains invalid data
  rpc AppendSession(stream AppendRequest) returns (AppendSessionResponse) {
    option (kurrent.rpc.possible_errors) =
      "NOT_FOUND,"
      "ALREADY_EXISTS,"
      "DELETED,"
      "STREAM_TOMBSTONED,"
      "STREAM_REVISION_CONFLICT,"
      "STREAM_ALREADY_IN_APPEND_SESSION,"
      "APPEND_SESSION_NO_REQUESTS,"
      "MAX_APPEND_RECORD_SIZE_EXCEEDED,"
      "MAX_APPEND_TRANSACTION_SIZE_EXCEEDED";
  }

  // Appends records to multiple streams atomically within a single transaction.
  //
  // This is a unary RPC where the client sends a single AppendRecordsRequest containing
  // all records and consistency checks, and receives a single AppendRecordsResponse.
  //
  // Records specify their target stream individually via the AppendRecord.stream field,
  // allowing a single request to write to multiple streams.
  //
  // Guarantees:
  // - Atomicity: All records across all streams are committed or all fail together
  // - Ordering: Records within each stream maintain their order from the request
  //
  // Consistency checks are evaluated before commit. They can validate:
  // - Stream revisions: A specific stream must be at an expected revision
  // - Queries: Arbitrary server-side expressions that must hold true
  //
  // Example flow:
  //   1. Client builds request with records targeting "orders" and "inventory" streams
  //   2. Client adds consistency checks (e.g., "orders" must be at revision 5)
  //   3. Client sends the request
  //   4. Server validates consistency checks, commits, returns stream revisions and position
  //
  // Common errors (automatically apply to all operations):
  // - UNAUTHENTICATED: No valid authentication credentials
  // - ACCESS_DENIED: User lacks write permission
  // - NOT_LEADER_NODE: Server is not the cluster leader
  // - INTERNAL: Internal server error
  // - UNAVAILABLE: Service unavailable
  // - BAD_REQUEST: Request contains invalid data
  rpc AppendRecords(AppendRecordsRequest) returns (AppendRecordsResponse);
}

// Request to append records to one or more streams atomically.
//
// All records are committed in a single transaction. Each record specifies
// its target stream via AppendRecord.stream. Consistency checks are evaluated
// before any records are written.
message AppendRecordsRequest {
  // The records to append.
  // Each record specifies its target stream via the AppendRecord.stream field.
  // Records targeting the same stream maintain their order from this list.
  repeated AppendRecord records = 1;

  // Optional consistency checks evaluated before commit.
  // If any check fails, the entire transaction is aborted.
  // Can include stream revision checks and/or query-based conditions.
  repeated ConsistencyCheck consistency_checks = 2;
}

// Response from a successful AppendRecords operation.
//
// Contains the resulting revision for each stream that was written to,
// and the global commit position of the transaction.
message AppendRecordsResponse {
  // The resulting revision for each stream that received records.
  // One entry per distinct stream written to, in no guaranteed order.
  repeated StreamRevision revisions = 1;

  // The global commit position of the last record written in this transaction.
  // Can be used for read-your-writes consistency or progress tracking.
  sint64 position = 2;
}

// A value type representing a specific revision of a stream.
// Used in responses to report the resulting revision of a stream after an append,
// and in consistency checks to assert the expected state of a stream before commit.
// The revision field can represent either:
// - A specific revision number (>= 0) indicating the exact revision of the stream
// - A RevisionConstants value (-100, -10, -4, -2, -1) indicating special stream states or semantics
message StreamRevision {
  // The stream name.
  string stream = 1;

  // The resulting revision of the stream after the append.
  // This is the revision number of the last record written to this stream.
  sint64 revision = 2;
}

// A pre-commit condition that must hold true for the transaction to succeed.
//
// Consistency checks are evaluated atomically before any records are written.
// If any check fails, the entire transaction is aborted.
//
// Two types of checks are supported:
// - Revision: Validates a stream's state using writability semantics (see RevisionConstants)
// - Query: Evaluates a server-side expression (e.g., cross-stream invariants)
message ConsistencyCheck {
  oneof type {
    // Check that a stream is at a specific state.
    // The revision field accepts RevisionConstants values or a specific revision number (>= 0).
    // Checks are evaluated using writability semantics — see RevisionConstants for the
    // full pass/fail matrix.
    StreamConsistencyCheck revision = 1;

    // Evaluate a server-side query expression.
    // The transaction is aborted if the expression evaluates to false.
    QueryConsistencyCheck query = 2;
  }
}

// A stream paired with its revision number.
//
// Used in two contexts:
// - As a consistency check: Asserts the stream is at the expected state before commit.
//   Accepts RevisionConstants values (-100, -10, -4, -2, -1) or a specific revision (>= 0).
//   Evaluated using writability semantics — see RevisionConstants for the full pass/fail matrix.
// - As a response field: Reports the actual revision of a stream after a successful write.
message StreamConsistencyCheck {
  // The stream name.
  string stream = 1;

  // The expected state of the stream for consistency checks, or the actual state in responses.
  sint64 expected_state = 2;
}

// A server-side query expression used as a consistency check.
//
// The expression is evaluated before commit. If it evaluates to false,
// the entire transaction is aborted. Can be used to enforce cross-stream
// invariants or other complex preconditions.
message QueryConsistencyCheck {
  // The query expression to evaluate.
  string expression = 1;
}


// Revision constants used in consistency checks and error details.
//
// These constants cover both directions:
// - Input: Expected state sent by the client in consistency checks
// - Output: Actual state returned by the server in error details
//
// Non-negative values (>= 0) represent actual stream revision numbers.
// Negative values represent special stream states or semantics.
//
// Consistency checks validate **writability**, not just existence:
// - A soft-deleted stream is writable (appending restores it)
// - A tombstoned stream is never writable (permanently sealed)
//
// Not all values are valid in both directions:
// - ANY (-2) and EXISTS (-4) are input-only (never returned as output)
//
// Pass/fail matrix (rows = input, columns = actual state):
//
//   Input \ Actual   | Revision M (>= 0) | NO_STREAM | DELETED  | TOMBSTONED
//   -----------------|--------------------|-----------|----------|----------
//   Revision N (>= 0)| pass (M = N)       | fail: -1  | pass (M = N) / fail: ? | fail: -100
//   NO_STREAM  (-1)  | fail: M            | pass      | pass     | fail: -100
//   ANY        (-2)  | pass               | pass      | pass     | fail: -100
//   EXISTS     (-4)  | pass               | fail: -1  | fail: -10| fail: -100
//   DELETED    (-10) | fail: M            | fail: -1  | pass     | fail: -100
//   TOMBSTONED (-100)| fail: M            | fail: -1  | fail: -10| pass
//
enum RevisionConstants {
  option allow_alias = true;

  // Default protobuf enum value. Aliases SINGLE_EVENT (0).
  // Avoid using directly — prefer SINGLE_EVENT for clarity.
  REVISION_CONSTANTS_UNSPECIFIED = 0;

  // Revision 0: the first revision of a stream.
  // Input: The stream must be at revision 0 (has exactly one record).
  // Output: The stream is at revision 0.
  REVISION_CONSTANTS_SINGLE_EVENT = 0;

  // Input: The stream must be writable as new — either it does not exist,
  //        or it has been soft-deleted (appending restores it).
  // Output: The stream does not exist (never created or fully removed).
  REVISION_CONSTANTS_NO_STREAM = -1;

  // Input only: Accept any writable state (no concurrency check).
  //             Passes for all states except TOMBSTONED.
  // Not valid as an output value.
  REVISION_CONSTANTS_ANY = -2;

  // Input only: The stream must be active (exist with a revision >= 0).
  //             Fails for NO_STREAM, DELETED, and TOMBSTONED.
  //             Note: a scavenged stream with no remaining records still
  //             satisfies this check if it has a revision.
  // Not valid as an output value.
  REVISION_CONSTANTS_EXISTS = -4;

  // Input: The stream must be soft-deleted.
  // Output: The stream has been soft-deleted.
  // A soft-deleted stream can be restored by appending new records.
  REVISION_CONSTANTS_DELETED = -10;

  // Input: The stream must be tombstoned.
  // Output: The stream has been tombstoned (permanently deleted).
  // A tombstoned stream cannot be restored or written to.
  REVISION_CONSTANTS_TOMBSTONED = -100;
}


// Represents the input for appending records to a specific stream.
message AppendRequest {
  // The stream to append records to.
  string stream = 1;

  // The records to append to the stream.
  repeated AppendRecord records = 2;

  // The expected revision for optimistic concurrency control.
  // Can be either:
  // - A specific revision number (0, 1, 2, ...) - the stream must be at exactly this revision
  // - An ExpectedRevisionConstants value (-4, -2, -1) for special semantics
  //
  // If omitted, defaults to EXPECTED_REVISION_CONSTANTS_ANY (-2).
  sint64 expected_revision = 3;
}

// Represents the outcome of an append operation.
message AppendResponse {
  // The stream to which records were appended.
  string stream = 1;

  // The actual/current revision of the stream after the append.
  // This is the revision number of the last record written to this stream.
  sint64 stream_revision = 2;

  // The position of the last appended record in the global log.
  sint64 position = 3;
}

message AppendSessionResponse {
  // The results of each append request in the session.
  repeated AppendResponse output = 1;

  // The global commit position of the last appended record in the session.
  sint64 position = 2;
}

// Record to be appended to a stream.
message AppendRecord {
  // Unique identifier for this record (must be a valid UUID/GUID).
  // If not provided, the server will generate a new one.
  string record_id = 1;

  // A collection of properties providing additional information about the
  // record. Can contain user-defined or system propreties.
  // System keys will be prefixed with "$" (e.g., "$timestamp").
  // User-defined keys MUST NOT start with "$".
  //
  // Common examples:
  //   User metadata:
  //     - "user-id": "12345"
  //     - "tenant": "acme-corp"
  //     - "source": "mobile-app"
  //
  //   System metadata (with $ prefix):
  //     - "$trace-id": "4bf92f3577b34da6a3ce929d0e0e4736"  // OpenTelemetry trace ID
  //     - "$span-id": "00f067aa0ba902b7"                   // OpenTelemetry span ID
  //     - "$timestamp": "2025-01-15T10:30:00.000Z"         // ISO 8601 timestamp
  map<string, google.protobuf.Value> properties = 2;

  // Schema information for this record.
  SchemaInfo schema = 3;

  // The record payload as raw bytes.
  // The format specified in SchemaInfo determines how to interpret these bytes.
  bytes data = 4;

  // The stream to which this record should be appended. This allows multiple records for different streams to be sent in a single request.
  string stream = 5;
}

// Constants for expected revision validation in optimistic concurrency control.
// These can be used in the expected_revision field, or you can specify an actual revision number.
enum ExpectedRevisionConstants {
  // The stream must have exactly one event at revision 0.
  // Used for scenarios requiring strict single-event semantics.
  EXPECTED_REVISION_CONSTANTS_SINGLE_EVENT = 0;
//  EXPECTED_REVISION_CONSTANTS_SINGLE_RECORD = 0;

  // The stream must not exist yet (first write to the stream).
  // Fails if the stream already has events.
  EXPECTED_REVISION_CONSTANTS_NO_STREAM = -1;

  // Accept any current state of the stream (no optimistic concurrency check).
  // The write will succeed regardless of the stream's current revision.
  EXPECTED_REVISION_CONSTANTS_ANY = -2;

  // The stream must exist (have at least one record).
  // Fails if the stream doesn't exist yet.
  EXPECTED_REVISION_CONSTANTS_EXISTS = -4;
}

//// Configuration for progress heartbeats during filtered reads.
////
//// Heartbeats provide progress visibility when a filter excludes records.
//// Without heartbeats, a worker processing a filter that matches few
//// records would have no way to know its actual position in the log.
////
//// Heartbeats report the current log position even when no records
//// are delivered, allowing workers to:
//// - Track progress through the log
//// - Detect when caught up to the head
//// - Confirm the connection is alive during quiet periods
