// ******************************************************************************************
// This protocol is UNSTABLE in the sense of being subject to change.
// ******************************************************************************************

edition = "2023";

package kurrentdb.protocol.v2.streams;

option csharp_namespace = "KurrentDB.Protocol.V2.Streams";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "kurrent/rpc/rpc.proto";

import "kurrentdb/protocol/v2/streams/shared.proto";

/**
 * Service for appending records to streams.
 */
service StreamsService {
  /**
   * Appends records to multiple streams atomically within a single transaction.
   *
   * Deprecated: Use AppendRecords instead.
   *
   * This is a client-streaming RPC where the client sends multiple AppendRequest
   * messages (one per stream) and receives a single AppendSessionResponse upon
   * commit.
   *
   * Guarantees:
   * - Atomicity: All writes succeed or all fail together.
   * - Optimistic Concurrency: Expected revisions validated before commit.
   * - Ordering: Records within each stream maintain send order.
   *
   * Current Limitations:
   * - Each stream can only appear once per session.
   *
   * Example flow:
   * 1. Client opens stream.
   * 2. Client sends AppendRequest for stream "orders" with 3 records.
   * 3. Client sends AppendRequest for stream "inventory" with 2 records.
   * 4. Client completes the stream.
   * 5. Server validates, commits, returns AppendSessionResponse with positions.
   *
   * Common errors (all operations):
   * - UNAUTHENTICATED: No valid authentication credentials.
   * - ACCESS_DENIED: User lacks write permission.
   * - NOT_LEADER_NODE: Server is not the cluster leader.
   * - INTERNAL: Internal server error.
   * - UNAVAILABLE: Service unavailable.
   * - BAD_REQUEST: Request contains invalid data.
   */
  rpc AppendSession(stream AppendRequest) returns (AppendSessionResponse) {
    option deprecated = true;
    option (kurrent.rpc.possible_errors) =
      "NOT_FOUND,"
      "ALREADY_EXISTS,"
      "DELETED"
      "STREAM_TOMBSTONED"
      "STREAM_REVISION_CONFLICT"
      "STREAM_ALREADY_IN_APPEND_SESSION"
      "APPEND_SESSION_NO_REQUESTS"
      "MAX_APPEND_RECORD_SIZE_EXCEEDED"
      "MAX_APPEND_TRANSACTION_SIZE_EXCEEDED";
  }

  /**
   * Appends records to multiple streams atomically within a single transaction.
   *
   * This is a unary RPC where the client sends a single AppendRecordsRequest
   * containing all records and consistency checks, and receives a single
   * AppendRecordsResponse.
   *
   * Records specify their target stream individually via the AppendRecord.stream
   * field, allowing a single request to write to multiple streams.
   *
   * Guarantees:
   * - Atomicity: All records across all streams are committed or all fail together.
   * - Ordering: Records within each stream maintain their order from the request.
   *
   * Consistency checks are evaluated before commit. They can validate:
   * - Stream state: a stream must be at an expected revision or lifecycle state.
   * - Query predicates: server-side expressions that must evaluate to true.
   *
   * Example flow:
   * 1. Client builds request with records targeting "orders" and "inventory".
   * 2. Client adds consistency checks (e.g., "orders" must be at revision 5).
   * 3. Client sends the request.
   * 4. Server validates, commits, returns stream revisions and position.
   *
   * Common errors (all operations):
   * - UNAUTHENTICATED: No valid authentication credentials.
   * - ACCESS_DENIED: User lacks write permission.
   * - NOT_LEADER_NODE: Server is not the cluster leader.
   * - INTERNAL: Internal server error.
   * - UNAVAILABLE: Service unavailable.
   * - BAD_REQUEST: Request contains invalid data.
   */
  rpc AppendRecords(AppendRecordsRequest) returns (AppendRecordsResponse) {
    option (kurrent.rpc.possible_errors) =
        "APPEND_CONSISTENCY_VIOLATION"
        "MAX_APPEND_RECORD_SIZE_EXCEEDED"
        "MAX_APPEND_TRANSACTION_SIZE_EXCEEDED";
  }
}

/**
 * Represents the input for appending records to a specific stream.
 *
 * Deprecated: Use AppendRecordsRequest instead.
 */
message AppendRequest {
  option deprecated = true;

  // The stream to append records to.
  string stream = 1;

  // The records to append to the stream.
  repeated AppendRecord records = 2;

  // The expected revision for optimistic concurrency control. Accepts a specific
  // revision number (0, 1, 2, ...) or an ExpectedRevisionConstants value (-4,
  // -2, -1). Defaults to EXPECTED_REVISION_CONSTANTS_ANY (-2) if omitted.
  sint64 expected_revision = 3;
}

/**
 * Represents the outcome of an append operation.
 *
 * Deprecated: Returned as part of AppendSessionResponse. Use
 * AppendRecordsResponse instead.
 */
message AppendResponse {
  option deprecated = true;

  // The stream to which records were appended.
  string stream = 1;

  // The resulting revision of the stream after the append.
  sint64 stream_revision = 2;

  // The position of the last appended record in the global log.
  sint64 position = 3;
}

/**
 * Response from the AppendSession operation.
 *
 * Deprecated: Use AppendRecordsResponse instead.
 */
message AppendSessionResponse {
  option deprecated = true;

  // The results of each append request in the session.
  repeated AppendResponse output = 1;

  // The global commit position of the last appended record in the session.
  sint64 position = 2;
}

/**
 * Record to be appended to a stream.
 *
 * Each record specifies its target stream via the stream field, allowing
 * multiple records for different streams to be sent in a single request.
 */
message AppendRecord {
  // Unique identifier for this record (must be a valid UUID/GUID).
  // If not provided, the server generates a new one.
  string record_id = 1;

  /**
   * Properties providing additional information about the record.
   *
   * Can contain user-defined or system properties. System keys are prefixed
   * with "$" (e.g., "$timestamp"). User-defined keys must not start with "$".
   *
   * User metadata examples:
   * - "user-id": "12345"
   * - "tenant": "acme-corp"
   * - "source": "mobile-app"
   *
   * System metadata examples:
   * - "$trace-id": "4bf92f3577b34da6a3ce929d0e0e4736" (OpenTelemetry trace ID)
   * - "$span-id": "00f067aa0ba902b7" (OpenTelemetry span ID)
   * - "$timestamp": "2025-01-15T10:30:00.000Z" (ISO 8601 timestamp)
   */
  map<string, google.protobuf.Value> properties = 2;

  // Schema info for this record.
  SchemaInfo schema = 3;

  // The record payload as raw bytes. Format is determined by SchemaInfo.
  bytes data = 4;

  // The target stream for this record.
  string stream = 5;
}

/**
 * Expected revision constants for optimistic concurrency control.
 *
 * Deprecated: Use StreamStateConstants with AppendRecordsRequest instead.
 * Retained for the deprecated AppendSession RPC only.
 */
enum ExpectedRevisionConstants {
  option deprecated = true;
  // The stream must have exactly one record at revision 0.
  EXPECTED_REVISION_CONSTANTS_SINGLE_EVENT = 0;
  // The stream must not exist yet (first write).
  EXPECTED_REVISION_CONSTANTS_NO_STREAM = -1;
  // Accept any current state (no concurrency check).
  EXPECTED_REVISION_CONSTANTS_ANY = -2;
  // The stream must exist (at least one record).
  EXPECTED_REVISION_CONSTANTS_EXISTS = -4;
}


/**
 * Request to append records to one or more streams atomically.
 *
 * All records are committed in a single transaction. Each record specifies its
 * target stream via AppendRecord.stream. Consistency checks are evaluated before
 * any records are written.
 */
message AppendRecordsRequest {
  // The records to append. Records targeting the same stream maintain their
  // order from this list.
  repeated AppendRecord records = 1;

  // Optional consistency checks evaluated before commit. If any check fails,
  // the entire transaction is aborted.
  repeated ConsistencyCheck checks = 2;
}

/**
 * Response from a successful AppendRecords operation.
 *
 * Contains the resulting revision for each stream that was written to and the
 * global commit position of the transaction.
 */
message AppendRecordsResponse {
  // The resulting revision for each stream that received records. One entry per
  // distinct stream written to, in no guaranteed order.
  repeated StreamRevision revisions = 1;

  // The global commit position of the last record written in this transaction.
  // Can be used for read-your-writes consistency or progress tracking.
  sint64 position = 2;
}

/**
 * A pre-commit condition that must hold true for the transaction to succeed.
 *
 * Consistency checks are evaluated atomically before any records are written. If
 * any check is violated, the entire transaction is aborted. Two types of checks
 * are supported: stream state checks (validates a stream's revision or lifecycle
 * state) and query predicates (evaluates a server-side expression).
 */
message ConsistencyCheck {
  oneof type {
    // Check that a stream is at a specific revision or lifecycle state.
    StreamStateCheck stream_state = 1;

    // Evaluate a server-side query predicate that must return true.
    QueryPredicateCheck query_predicate = 2;
  }

  /**
   * Asserts a stream is at a specific revision or lifecycle state before commit.
   *
   * The expected_state field accepts a specific revision number (>= 0) or a
   * special state constant (e.g., -1 for NO_STREAM, -10 for DELETED). Evaluated
   * using writability semantics: a soft-deleted stream is writable (appending
   * restores it), but a tombstoned stream is never writable.
   */
  message StreamStateCheck {
    // The stream name.
    string stream = 1;

    // The expected state of the stream (revision number or state constant).
    sint64 expected_state = 2;
  }

  /**
   * A server-side query predicate evaluated before commit.
   *
   * If the predicate expression evaluates to false, the entire transaction is
   * aborted. Can be used to enforce cross-stream conditions or other complex
   * preconditions.
   */
  message QueryPredicateCheck {
    // The predicate expression to evaluate.
    string expression = 1;
  }
}

/**
 * Stream state constants used in consistency checks and error details.
 *
 * These constants cover both directions:
 * - Input: Expected state sent by the client in consistency checks.
 * - Output: Actual state returned by the server in error details.
 *
 * Non-negative values (>= 0) represent actual stream revision numbers.
 * Negative values represent special stream states.
 *
 * Consistency checks validate writability, not just existence:
 * - A soft-deleted stream is writable (appending restores it).
 * - A tombstoned stream is never writable (permanently sealed).
 *
 * Not all values are valid in both directions:
 * - ANY (-2) and EXISTS (-4) are input-only (never returned as output).
 *
 * Pass/fail matrix (rows = input, columns = actual state):
 *
 * | Input \ Actual     | Rev M (>= 0)  | NO_STREAM | DELETED       | TOMBSTONED |
 * |--------------------|---------------|-----------|---------------|------------|
 * | Rev N (>= 0)       | pass (M = N)  | fail: -1  | pass/fail (N) | fail: -100 |
 * | NO_STREAM  (-1)    | fail: M       | pass      | pass          | fail: -100 |
 * | ANY        (-2)    | pass          | pass      | pass          | fail: -100 |
 * | EXISTS     (-4)    | pass          | fail: -1  | fail: -10     | fail: -100 |
 * | DELETED    (-10)   | fail: M       | fail: -1  | pass          | fail: -100 |
 * | TOMBSTONED (-100)  | fail: M       | fail: -1  | fail: -10     | pass       |
 */
enum StreamStateConstants {
  option allow_alias = true;
  // Default protobuf enum value. Use STREAM_STATE_CONSTANTS_SINGLE_RECORD.
  STREAM_STATE_CONSTANTS_UNSPECIFIED = 0;
  // Revision 0: the stream has exactly one record.
  STREAM_STATE_CONSTANTS_SINGLE_RECORD = 0;
  // Input: stream must be writable as new (does not exist or soft-deleted).
  // Output: stream does not exist.
  STREAM_STATE_CONSTANTS_NO_STREAM = -1;
  // Input only: accept any writable state (no concurrency check).
  // Passes for all states except TOMBSTONED.
  STREAM_STATE_CONSTANTS_ANY = -2;
  // Input only: stream must be active (revision >= 0).
  // Fails for NO_STREAM, DELETED, and TOMBSTONED. A scavenged stream with
  // no remaining records still satisfies this check if it has a revision.
  STREAM_STATE_CONSTANTS_EXISTS = -4;
  // Input: stream must be soft-deleted. Output: stream is soft-deleted.
  // A soft-deleted stream can be restored by appending new records.
  STREAM_STATE_CONSTANTS_DELETED = -10;
  // Input: stream must be tombstoned. Output: stream is tombstoned.
  // A tombstoned stream cannot be restored or written to.
  STREAM_STATE_CONSTANTS_TOMBSTONED = -100;
}
