//
//// Determines how records are distributed among workers in a processor.
////
//// Each mode represents a different tradeoff between ordering guarantees,
//// throughput, and complexity. Choose based on your requirements.
////
//// Each mode has an implied rebalance strategy optimized for its use case.
//enum ProcessingMode {
//  // Unspecified - server will use default (EXCLUSIVE).
//  PROCESSING_MODE_UNSPECIFIED = 0;
//
//  // Single active worker receives all records.
//  //
//  // Other workers are on standby and will take over if the active
//  // worker fails (failover pattern). Provides global ordering
//  // guarantees since only one worker processes at a time.
//  //
//  // Rebalance: Immediate failover to standby.
//  //
//  // Use when:
//  // - Global ordering is required
//  // - Running projections
//  // - Single-writer scenarios
//  // - Simplicity over throughput
//  //
//  // Limitations:
//  // - No horizontal scaling (throughput limited to one worker)
//  // - Standby workers consume resources but don't process
//  PROCESSING_MODE_EXCLUSIVE = 1;
//
//  // Records are distributed round-robin across all workers.
//  //
//  // Also known as "competing consumers" pattern. Multiple workers
//  // process in parallel for maximum throughput, but there are no
//  // ordering guarantees - records may be processed out of order.
//  //
//  // Rebalance: Cooperative sticky (minimizes disruption, keeps
//  // existing assignments when possible).
//  //
//  // Use when:
//  // - Maximum throughput is needed
//  // - Processing is stateless
//  // - Order doesn't matter
//  // - Workers are interchangeable
//  //
//  // Limitations:
//  // - No ordering guarantees
//  // - Not suitable for stateful processing
//  PROCESSING_MODE_SHARED = 2;
//
//  // Records with the same key are always routed to the same worker.
//  //
//  // Provides ordering guarantees per key while allowing parallelism
//  // across different keys. The "key" is typically the stream ID or
//  // a correlation ID depending on configuration.
//  //
//  // Rebalance: Sticky (keys stay with same worker when possible
//  // to maintain hot caches and reduce state transfer).
//  //
//  // Use when:
//  // - Per-entity ordering is required (e.g., all records for an order)
//  // - Stateful processing with per-key state
//  // - Aggregations grouped by key
//  // - Balance between ordering and throughput
//  //
//  // Limitations:
