name: Setup .NET with cache
description: Cache .NET SDK and NuGet packages, setup SDKs, and restore packages

inputs:
  dotnet-version:
    description: .NET SDK versions to install
    required: true
  locked-mode:
    description: Use --locked-mode for dotnet restore
    required: false
    default: 'false'
  cache-key:
    description: Override the default cache key
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Cache .NET SDKs and NuGet packages
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          /usr/share/dotnet
          ~/.nuget/packages
        key: ${{ inputs.cache-key || format('dotnet-{0}', runner.os) }}

    - name: Setup .NET
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore tools
      shell: bash
      run: dotnet tool restore

    - name: Restore packages
      shell: bash
      run: dotnet restore ${{ inputs.locked-mode == 'true' && '--locked-mode' || '' }}
