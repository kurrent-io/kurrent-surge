name: Setup .NET
description: >
  Installs and caches .NET SDKs and NuGet packages, restores dotnet tools
  globally (available on PATH without the `dotnet` prefix), and restores
  NuGet packages. Configuration is driven by environment variables set in
  the calling workflow, keeping the input surface minimal.

  Environment variables (set by caller and linux defaults):
    DOTNET_INSTALL_VERSIONS  — Newline-separated SDK versions (default: 10.x)
    DOTNET_INSTALL_DIR       — SDK install directory (default: $HOME/.dotnet)
    NUGET_PACKAGES           — NuGet global packages dir (default: $HOME/.nuget/packages)
  Tool manifest discovery searches these locations (first match wins):
    tools/ → .build/ → build/ → .github/ → .ci/ → ci/
  Falls back to `dotnet tool restore` if no manifest is found.

inputs:
  cache-key:
    description: Override the default cache key. Defaults to dotnet-{os}.
    required: false
    default: ''
  restore-args:
    description: Additional arguments passed to dotnet restore.
    required: false
    default: ''

outputs:
  cache-hit:
    description: Whether the cache was restored from a previous run.
    value: ${{ steps.cache.outputs.cache-hit }}
  dotnet-install-dir:
    description: Absolute path to the .NET SDK installation directory.
    value: ${{ env.DOTNET_INSTALL_DIR }}
  nuget-packages-dir:
    description: Absolute path to the NuGet global packages directory.
    value: ${{ env.NUGET_PACKAGES }}

runs:
  using: composite
  steps:
    # Resolve environment defaults so subsequent steps can reference them.
    # DOTNET_MULTILEVEL_LOOKUP=0 prevents the SDK from probing system-wide installs.
    - name: Set .NET environment
      shell: bash
      run: |
        echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
        echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV

        # Normalize DOTNET_INSTALL_VERSIONS to newline-separated values.
        # Accepts: JSON array, comma-separated, space-separated, or multiline.
        raw="${DOTNET_INSTALL_VERSIONS:-10.x}"
        if [[ "$raw" == \[* ]]; then
          versions=$(echo "$raw" | jq -r '.[]')
        else
          versions=$(echo "$raw" | tr ',' '\n' | tr ' ' '\n' | sed '/^$/d')
        fi
        {
          echo "DOTNET_INSTALL_VERSIONS<<EOF"
          echo "$versions"
          echo "EOF"
        } >> $GITHUB_ENV

        echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

    - name: Cache .NET SDKs and NuGet packages
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.DOTNET_INSTALL_DIR }}
          ${{ env.NUGET_PACKAGES }}
        key: ${{ inputs.cache-key || format('dotnet-{0}', runner.os) }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: ${{ env.DOTNET_INSTALL_VERSIONS }}

    # Search for a tool manifest in common project locations. The first match
    # wins. When found, tools are installed globally so they appear on PATH
    # (e.g. `minver` instead of `dotnet minver`). Falls back to standard
    # `dotnet tool restore` for .config/dotnet-tools.json discovery.
    #
    # Search order:
    #   tools/  →  .build/  →  build/  →  .github/  →  .ci/  →  ci/
    - name: Restore tools
      shell: bash
      run: |
        search_paths='[
          "tools/dotnet-tools.json",
          "tools/dotnet-tools.json",
          ".build/dotnet-tools.json",
          ".build/tools/dotnet-tools.json",
          "build/dotnet-tools.json",
          "build/tools/dotnet-tools.json",
          ".github/dotnet-tools.json",
          ".github/tools/dotnet-tools.json",
          ".ci/dotnet-tools.json",
          ".ci/tools/dotnet-tools.json",
          "ci/dotnet-tools.json",
          "ci/tools/dotnet-tools.json"
        ]'

        manifest=""
        for path in $(echo "$search_paths" | jq -r '.[]'); do
          if [ -f "$path" ]; then
            manifest="$path"
            break
          fi
        done

        if [ -n "$manifest" ]; then
          echo "Found tool manifest at $manifest"
          jq -r '.tools | to_entries[] | "\(.key) \(.value.version)"' "$manifest" | while read -r tool version; do
            dotnet tool install -g "$tool" --version "$version"
          done
        else
          dotnet tool restore
        fi

        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Restore packages
      shell: bash
      run: dotnet restore ${{ inputs.restore-args }}
