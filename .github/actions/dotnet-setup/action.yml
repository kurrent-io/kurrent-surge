name: Restore .NET
description: >
  Installs and caches .NET SDKs, restores NuGet packages, and restores
  dotnet tools globally (available on PATH without the `dotnet` prefix).
  Configuration is driven by environment variables set in the calling
  workflow, keeping the input surface minimal.

  Environment variables (set by caller and linux defaults):
    DOTNET_INSTALL_VERSIONS  — Newline-separated SDK versions (default: 10.x)
    DOTNET_INSTALL_DIR       — SDK install directory (default: $HOME/.dotnet)
    NUGET_PACKAGES           — NuGet global packages dir (default: $HOME/.nuget/packages)

  Tool restore order:
    1. dotnet tool restore (.config/dotnet-tools.json)
    2. Pack and install file-based apps from tools/ (*.cs with ToolCommandName)
  File-based app tools are installed globally so they appear on
  PATH directly (e.g. `semver-bump` instead of `dotnet run tools/semver-bump.cs`).

inputs:
  cache-key:
    description: Override the default cache key. Defaults to dotnet-{os}.
    required: false
    default: ''
  restore-args:
    description: Additional arguments passed to dotnet restore.
    required: false
    default: ''

outputs:
  cache-hit:
    description: Whether the cache was restored from a previous run.
    value: ${{ steps.cache.outputs.cache-hit }}
  dotnet-install-dir:
    description: Absolute path to the .NET SDK installation directory.
    value: ${{ env.DOTNET_INSTALL_DIR }}
  nuget-packages-dir:
    description: Absolute path to the NuGet global packages directory.
    value: ${{ env.NUGET_PACKAGES }}

runs:
  using: composite
  steps:
    # Resolve environment defaults so subsequent steps can reference them.
    # DOTNET_MULTILEVEL_LOOKUP=0 prevents the SDK from probing system-wide installs.
    - name: Prepare environment
      shell: bash
      run: |
        echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
        echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV

        # Normalize DOTNET_INSTALL_VERSIONS to newline-separated values.
        # Accepts: JSON array, comma-separated, space-separated, or multiline.
        raw="${DOTNET_INSTALL_VERSIONS:-10.x}"
        if [[ "$raw" == \[* ]]; then
          versions=$(echo "$raw" | jq -r '.[]')
        else
          versions=$(echo "$raw" | tr ',' '\n' | tr ' ' '\n' | sed '/^$/d')
        fi
        {
          echo "DOTNET_INSTALL_VERSIONS<<EOF"
          echo "$versions"
          echo "EOF"
        } >> $GITHUB_ENV

        echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

    - name: Cache SDK's, packages and tools
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.DOTNET_INSTALL_DIR }}
          ${{ env.NUGET_PACKAGES }}
        key: ${{ inputs.cache-key || format('dotnet-{0}', runner.os) }}

    - name: Setup SDK's
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: ${{ env.DOTNET_INSTALL_VERSIONS }}

    - name: Restore packages
      shell: bash
      run: dotnet restore ${{ inputs.restore-args }}

    - name: Restore tools
      shell: bash
      run: dotnet tool restore

    # Pack file-based apps (*.cs with ToolCommandName) from tools/ and
    # install them as global tools so they appear on PATH directly.
    # Uses `dotnet tool update` to handle both fresh installs and upgrades.
    - name: Install local tools
      shell: bash
      run: |
        if compgen -G "tools/*.cs" > /dev/null; then
          pack_dir="$(mktemp -d)"
          for cs in tools/*.cs; do
            if grep -q 'ToolCommandName' "$cs"; then
              echo "Packing $cs"
              dotnet pack "$cs" -o "$pack_dir" -v q --nologo
            fi
          done

          for pkg in "$pack_dir"/*.nupkg; do
            [ -f "$pkg" ] || continue
            name=$(basename "$pkg" | sed 's/\.[0-9].*//')
            echo "Installing tool $name"
            dotnet tool update -g "$name" --add-source "$pack_dir" --no-cache -v q
          done

          rm -rf "$pack_dir"
        fi

        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Build project
      shell: bash
      run: dotnet build -c Release --no-restore
