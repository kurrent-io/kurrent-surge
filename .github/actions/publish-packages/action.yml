name: NuGet Publish
description: >
  Packs .NET projects and pushes NuGet packages to one or more feeds.
  Supports GitHub Packages and NuGet.org as destinations.

  Packing runs first (unless disabled), then packages are pushed to each
  destination declared in push-to.

  Destinations (push-to, required):
    github — GitHub Packages (https://nuget.pkg.github.com/{owner}/index.json)
    nuget  — NuGet.org (https://api.nuget.org/v3/index.json)

inputs:
  push-to:
    description: >
      Destinations to push packages to. Space-separated, YAML list, or
      comma-separated. Supported values: github, nuget.
    required: true
  version:
    description: >
      Package version passed as -p:Version to dotnet pack.
      Required when pack is true. Ignored when pack is false.
    required: false
    default: ''
  pack:
    description: Run dotnet pack before pushing. Set to false for push-only.
    required: false
    default: 'true'
  pack-args:
    description: >
      Arguments passed to dotnet pack. Defaults to `-c Release --no-build`
      to match the Release build produced by dotnet-setup. Override to
      control build behavior or add flags.
    required: false
    default: '-c Release --no-build'
  nuget-api-key:
    description: API key for NuGet.org. Required when push-to includes 'nuget'.
    required: false
    default: ''
  upload-artifacts:
    description: Upload packed .nupkg files as a GitHub Actions artifact.
    required: false
    default: 'false'

outputs:
  packages-path:
    description: Path to the directory containing the packed .nupkg files.
    value: ${{ runner.temp }}/packages

runs:
  using: composite
  steps:
    - name: Pack
      if: inputs.pack == 'true'
      shell: bash
      run: |
        dotnet pack \
          -o ${{ runner.temp }}/packages \
          -p:Version=${{ inputs.version }} \
          ${{ inputs.pack-args }}

    - name: Push to GitHub
      if: contains(inputs.push-to, 'github')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        dotnet nuget push ${{ runner.temp }}/packages/*.nupkg \
          --skip-duplicate \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key "$GITHUB_TOKEN"

    - name: Push to NuGet.org
      if: contains(inputs.push-to, 'nuget')
      shell: bash
      env:
        NUGET_API_KEY: ${{ inputs.nuget-api-key }}
      run: |
        if [[ -z "$NUGET_API_KEY" ]]; then
          echo "::error::nuget-api-key is required when pushing to NuGet.org."
          exit 1
        fi
        dotnet nuget push ${{ runner.temp }}/packages/*.nupkg \
          --skip-duplicate \
          --source https://api.nuget.org/v3/index.json \
          --api-key "$NUGET_API_KEY"

    - name: Upload package artifacts
      if: inputs.upload-artifacts == 'true' && !failure()
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ${{ runner.temp }}/packages/
        if-no-files-found: ignore
