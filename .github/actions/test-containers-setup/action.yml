name: Test Containers Setup
description: >
  Logs into one or more Docker registries, pulls images in parallel, and sets
  TESTCONTAINER_*_IMAGE environment variables for each container used in
  integration tests.

  Registry entries without credentials fall back to default-credentials.

inputs:
  default-credentials:
    description: >
      Default username and password used for registries that don't specify their own.
      Example:
        default-credentials: |
          username: <your-username>
          password: <your-password>
    required: false
    default: ''
  registries:
    description: >
      YAML list of registries to log into. Per-entry credentials override default-credentials.
      Example:
        registries: |
          - registry: docker.cloudsmith.io
          - registry: docker.kurrent.io
            username: <override-username>
            password: <override-password>
    required: false
    default: ''
  images:
    description: >
      YAML mapping of container names to image references.
      Example:
        images: |
          KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly
    required: true

runs:
  using: composite
  steps:
    - name: Login to registries
      if: inputs.registries != ''
      shell: bash
      run: |
        default_user=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.username // ""')
        default_pass=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.password // ""')

        printf '%s' '${{ inputs.registries }}' | yq -r '.[] | [.registry, (.username // ""), (.password // "")] | @tsv' | \
        while IFS=$'\t' read -r registry user pass; do
          user="${user:-$default_user}"
          pass="${pass:-$default_pass}"
          echo "Logging into $registry..."
          printf '%s' "$pass" | docker login "$registry" -u "$user" --password-stdin
        done

    - name: Setup test containers environment
      shell: bash
      run: |
        echo '${{ inputs.images }}' | yq -o=json | jq -r 'to_entries | .[] | "TESTCONTAINER_\(.key)_IMAGE=\(.value)"' >> $GITHUB_ENV

        echo "Set the following container variables:"
        echo '${{ inputs.images }}' | yq -o=json | jq -r 'to_entries | .[] | "TESTCONTAINER_\(.key)_IMAGE=\(.value)"'

    - name: Pull Docker images
      shell: bash
      run: |
        echo '${{ inputs.images }}' | yq -o=json | jq -r 'to_entries | .[] | .value' | while read -r image; do
          echo "Pulling $image..."
          docker pull $image --quiet &
        done
        wait

    - name: Create Docker Compose symlink
      shell: bash
      run: sudo ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
