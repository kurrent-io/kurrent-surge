name: Install Local Tools
description: >
  Packs file-based app tools from tools/ (those with a ToolCommandName) and installs them
  into a workspace-local tool path on PATH, so they can be invoked by their command name.
  The install lives under the workspace (.artifacts/tools), not shared home, so a poisoned
  build cannot persist across jobs on a self-hosted runner.

runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      run: |
        compgen -G "tools/*.cs" > /dev/null || exit 0

        pack_dir="$(mktemp -d)"
        for cs in tools/*.cs; do
          grep -q 'ToolCommandName' "$cs" || continue
          echo "Packing $cs"
          dotnet pack "$cs" -o "$pack_dir" -v q --nologo
        done

        shopt -s nullglob
        packages=("$pack_dir"/*.nupkg)
        if [[ ${#packages[@]} -eq 0 ]]; then
          echo "::error::No tool packages were produced from tools/*.cs"
          exit 1
        fi

        # Isolated source: the repo's package source mapping forbids --add-source, and tool
        # packages bundle their dependencies, so a single local source resolves them.
        printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration><packageSources><clear /><add key="tools" value="%s" /></packageSources></configuration>\n' "$pack_dir" > "$pack_dir/nuget.config"

        tool_dir="$GITHUB_WORKSPACE/.artifacts/tools"
        for pkg in "${packages[@]}"; do
          name=$(basename "$pkg" | sed 's/\.[0-9].*//')
          echo "Installing $name -> $tool_dir"
          dotnet tool update "$name" --tool-path "$tool_dir" --configfile "$pack_dir/nuget.config" --no-cache -v q
        done

        echo "$tool_dir" >> "$GITHUB_PATH"
        rm -rf "$pack_dir"
