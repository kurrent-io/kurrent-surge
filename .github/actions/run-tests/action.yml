name: Run Tests
description: >
  Runs .NET tests by category with convention-driven defaults.
  Pass a category and the action derives the filter, results directory,
  report name, and sensible extra arguments automatically.

inputs:
  category:
    description: Test category — 'unit' or 'integration'.
    required: true
  filter:
    description: TUnit treenode filter. Overrides the category default.
    required: false
    default: ''
  report-name:
    description: Sets the test report name. Overrides the category default.
    required: false
    default: ''
  extra-args:
    description: Additional TUnit arguments appended after '--' (e.g., '--maximum-parallel-tests 1').
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure
      id: config
      shell: bash
      env:
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_REPORT_NAME: ${{ inputs.report-name }}
      run: |
        results_dir=".artifacts/test-results/$INPUT_CATEGORY"

        case "$INPUT_CATEGORY" in
          unit)        filter="/*/*/*/*[Category!=Integration]" ; tunit_args="" ;;
          integration) filter="/*/*/*/*[Category=Integration]"  ; tunit_args="--maximum-failed-tests 1" ;;
          *) echo "::error::Unknown test category: $INPUT_CATEGORY (expected 'unit' or 'integration')"; exit 1 ;;
        esac

        report_name="${INPUT_REPORT_NAME:-${INPUT_CATEGORY^} Tests}"
        [[ "$tunit_args" == *"--maximum-failed-tests"* ]] && report_name="$report_name (fail fast)"

        echo "filter=${INPUT_FILTER:-$filter}" >> "$GITHUB_OUTPUT"
        echo "results-dir=$results_dir" >> "$GITHUB_OUTPUT"
        echo "report-name=$report_name" >> "$GITHUB_OUTPUT"
        echo "tunit-args=$tunit_args" >> "$GITHUB_OUTPUT"

    - name: Clean results directory
      shell: bash
      run: rm -rf ${{ steps.config.outputs.results-dir }}

    - name: Run ${{ inputs.category }} tests
      id: test
      shell: bash
      env:
        TUNIT_DISABLE_HTML_REPORTER: true
        TUNIT_DISABLE_GITHUB_REPORTER: true
        TUNIT_DISABLE_LOGO: true
        TESTINGPLATFORM_TELEMETRY_OPTOUT: true
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 \
          --results-directory ${{ steps.config.outputs.results-dir }} \
          -- \
          --treenode-filter "${{ steps.config.outputs.filter }}" \
          --report-trx \
          ${{ steps.config.outputs.tunit-args }} \
          $EXTRA_ARGS \
          || exit_code=$?
        echo "exit-code=${exit_code:-0}" >> "$GITHUB_OUTPUT"
        exit ${exit_code:-0}

    - name: Remove empty TRX files
      if: '!cancelled()'
      shell: bash
      run: find ${{ steps.config.outputs.results-dir }} -name '*.trx' -exec grep -l 'total="0"' {} + | xargs -r rm || true

    - name: ${{ steps.config.outputs.report-name }} report
      if: '!cancelled()'
      uses: dorny/test-reporter@v3
      with:
        name: ${{ steps.config.outputs.report-name }}
        path: ${{ steps.config.outputs.results-dir }}/**/*.trx
        reporter: dotnet-trx
        fail-on-error: false
        fail-on-empty: false
        only-summary: true
        max-annotations: 50
        badge-title: ${{ inputs.category }}
        report-title: ${{ steps.config.outputs.report-name }}

    - name: Annotate test host crash
      if: ${{ !cancelled() && steps.test.outputs.exit-code > 128 }}
      shell: bash
      env:
        TUNIT_ARGS: ${{ steps.config.outputs.tunit-args }}
      run: |
        exit_code=${{ steps.test.outputs.exit-code }}
        signal=$((exit_code - 128))
        case $signal in
          6)  signal_name="SIGABRT" ;;
          9)  signal_name="SIGKILL" ;;
          11) signal_name="SIGSEGV" ;;
          15) signal_name="SIGTERM" ;;
          *)  signal_name="signal $signal" ;;
        esac

        if [[ "$TUNIT_ARGS" == *"--fail-fast"* ]]; then
          {
            echo "> [!CAUTION]"
            echo "> **Test Host Crash (fail-fast)**"
            echo ">"
            echo "> A test failure triggered \`--fail-fast\` cancellation, and the test host was killed by **$signal_name** (exit code $exit_code) during shutdown."
            echo "> Results from the crashed assembly are **missing** from the test report above."
          } >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "> [!CAUTION]"
            echo "> **Test Host Crash**"
            echo ">"
            echo "> A test host process was killed by **$signal_name** (exit code $exit_code)."
            echo "> Results from the crashed assembly are **missing** from the test report above."
            echo "> See [exit code reference](https://aka.ms/testingplatform/exitcodes) for details."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
