name: Test Containers Setup
description: >
  Logs into one or more Docker registries, pulls images in parallel, and sets
  {NAME}__CONTAINER__{REGISTRY,IMAGE,TAG} and {NAME}__IMAGE_REF environment variables for each
  container used in integration tests. Image references are validated against
  the configured registries.

  Registry entries without credentials fall back to default-credentials.

inputs:
  default-credentials:
    description: >
      Default username and password used for registries that don't specify their own.
      Example:
        default-credentials: |
          username: <your-username>
          password: <your-password>
    required: false
    default: ''
  registries:
    description: >
      YAML list of registries to log into. Per-entry credentials override default-credentials.
      Example:
        registries: |
          - registry: docker.cloudsmith.io
          - registry: docker.kurrent.io
            username: <override-username>
            password: <override-password>
    required: false
    default: ''
  images:
    description: >
      YAML mapping of container names to image references.
      Example:
        images: |
          KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly
    required: true

runs:
  using: composite
  steps:
    - name: Create Docker Compose symlink
      shell: bash
      run: ln -sf /usr/libexec/docker/cli-plugins/docker-compose "$HOME/.local/bin/docker-compose"

    - name: Login, configure, and pull
      shell: bash
      run: |
        set -euo pipefail

        # --- Login to registries ---
        default_user=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.username // ""')
        default_pass=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.password // ""')

        registry_count=$(printf '%s' '${{ inputs.registries }}' | yq 'length')

        for i in $(seq 0 $((registry_count - 1))); do
          registry=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].registry")
          user=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].username // \"\"")
          pass=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].password // \"\"")
          user="${user:-$default_user}"
          pass="${pass:-$default_pass}"
          echo "Logging into $registry..."
          printf '%s' "$pass" | docker login "$registry" -u "$user" --password-stdin
        done

        # --- Setup environment variables ---
        registries=$(printf '%s' '${{ inputs.registries }}' | yq -r '.[].registry')

        echo '${{ inputs.images }}' | yq -r '
          to_entries[] |
          (.key | upcase) as $name |
          (.value.ImageRef // .value) as $image_ref |
          ($image_ref | split(":") | .[0]) as $ref |
          ($image_ref | split(":") | .[1] // "latest") as $tag |
          "\($name) \($ref) \($tag) \($image_ref)"
        ' | while read -r name ref tag image_ref; do
          matched_registry=""
          while IFS= read -r reg; do
            if [[ "$ref" == "$reg"* ]]; then
              if [ ${#reg} -gt ${#matched_registry} ]; then
                matched_registry="$reg"
              fi
            fi
          done <<< "$registries"

          if [ -z "$matched_registry" ]; then
            echo "::error::No matching registry for image: $image_ref"
            exit 1
          fi

          image="${ref#"$matched_registry"}"
          image="${image#/}"

          echo "${name}__CONTAINER__REGISTRY=$matched_registry" | tee -a "$GITHUB_ENV"
          echo "${name}__CONTAINER__IMAGE=$image" | tee -a "$GITHUB_ENV"
          echo "${name}__CONTAINER__TAG=$tag" | tee -a "$GITHUB_ENV"
          echo "${name}__IMAGE_REF=$image_ref" | tee -a "$GITHUB_ENV"
        done

        # --- Pull images with retry ---
        pull_image() {
          local image="$1" attempt
          for attempt in 1 2 3; do
            if docker pull "$image" --quiet; then
              return 0
            fi
            echo "::warning::Pull attempt $attempt failed for $image — retrying in 10s..."
            sleep 10
          done
          return 1
        }

        images=$(echo '${{ inputs.images }}' | yq -r '
          to_entries[] | .value.ImageRef // .value
        ')
        failed=0
        for image in $images; do
          echo "Pulling $image..."
          if ! pull_image "$image"; then
            echo "::warning::All pull attempts failed for $image"
          fi

          if ! docker image inspect "$image" > /dev/null 2>&1; then
            echo "::error::Image $image not available locally — cannot proceed"
            failed=1
          fi
        done
        exit $failed
