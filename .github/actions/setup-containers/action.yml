name: Setup Containers
description: >
  Logs into one or more Docker registries, pulls images, and sets {NAME}_IMAGEREF
  environment variables for each container used in integration tests.
  Image references are validated against the configured registries.

  Registry entries without credentials fall back to default-credentials.

inputs:
  default-credentials:
    description: >
      Default username and password used for registries that don't specify their own.
      Example:
        default-credentials: |
          username: <your-username>
          password: <your-password>
    required: false
    default: ''
  registries:
    description: >
      YAML list of registries to log into. Per-entry credentials override default-credentials.
      Example:
        registries: |
          - registry: docker.cloudsmith.io
          - registry: docker.kurrent.io
            username: <override-username>
            password: <override-password>
    required: false
    default: ''
  images:
    description: >
      Newline-separated KEY=VALUE pairs. Each line is exported as an environment
      variable and the value is pulled as a Docker image.
      Example:
        images: |
          KURRENTDB_IMAGEREF=docker.kurrent.io/kurrent-staging/kurrentdb:ci
    required: true

runs:
  using: composite
  steps:
    - name: Create Docker Compose symlink
      shell: bash
      run: ln -sf /usr/libexec/docker/cli-plugins/docker-compose "$HOME/.local/bin/docker-compose"

    - name: Login, configure, and pull
      shell: bash
      run: |
        set -euo pipefail

        # --- Login to registries ---
        default_user=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.username // ""')
        default_pass=$(printf '%s' '${{ inputs.default-credentials }}' | yq -r '.password // ""')

        registry_count=$(printf '%s' '${{ inputs.registries }}' | yq 'length')

        for i in $(seq 0 $((registry_count - 1))); do
          registry=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].registry")
          user=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].username // \"\"")
          pass=$(printf '%s' '${{ inputs.registries }}' | yq -r ".[$i].password // \"\"")
          user="${user:-$default_user}"
          pass="${pass:-$default_pass}"

          # No credentials anywhere = anonymous registry (public images); skip login.
          if [[ -z "$user" ]]; then
            echo "No credentials for $registry — pulling anonymously."
            continue
          fi

          echo "Logging into $registry..."
          printf '%s' "$pass" | docker login "$registry" -u "$user" --password-stdin
        done

        # --- Validate, export, and pull image refs ---
        registries=$(printf '%s' '${{ inputs.registries }}' | yq -r '.[].registry')

        failed=0
        while IFS='=' read -r name image_ref; do
          [[ -z "$name" ]] && continue

          matched=false
          while IFS= read -r reg; do
            if [[ "$image_ref" == "$reg"* ]]; then
              matched=true
              break
            fi
          done <<< "$registries"

          if [[ "$matched" != "true" ]]; then
            echo "::error::No matching registry for image: $image_ref"
            exit 1
          fi

          echo "$name=$image_ref" | tee -a "$GITHUB_ENV"

          echo "Pulling $image_ref..."
          docker pull "$image_ref" --quiet || true

          if ! docker image inspect "$image_ref" > /dev/null 2>&1; then
            echo "::error::Image $image_ref not available locally — cannot proceed"
            failed=1
          fi
        done <<< '${{ inputs.images }}'
        exit $failed
