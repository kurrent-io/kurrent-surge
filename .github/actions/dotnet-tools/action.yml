name: Restore .NET Tools
description: >
  Restores dotnet tools from the manifest and packs/installs file-based
  app tools from tools/ as global tools so they appear on PATH directly.

runs:
  using: composite
  steps:
    - name: Install manifest tools globally
      shell: bash
      run: |
        manifest=".config/dotnet-tools.json"
        if [ -f "$manifest" ]; then
          for name in $(jq -r '.tools | keys[]' "$manifest"); do
            version=$(jq -r --arg n "$name" '.tools[$n].version' "$manifest")
            echo "Installing $name@$version"
            dotnet tool update -g "$name" --version "$version" --allow-roll-forward -v q --no-cache
          done
        fi

    # Pack file-based apps (*.cs with ToolCommandName) from tools/ and
    # install them as global tools so they appear on PATH directly.
    # Uses `dotnet tool update` to handle both fresh installs and upgrades.
    - name: Install local tools
      shell: bash
      run: |
        if compgen -G "tools/*.cs" > /dev/null; then
          pack_dir="$(mktemp -d)"
          for cs in tools/*.cs; do
            if grep -q 'ToolCommandName' "$cs"; then
              echo "Packing $cs"
              dotnet build "$cs" -v q --nologo
              dotnet pack "$cs" -o "$pack_dir" --no-build -v q --nologo
            fi
          done

          for pkg in "$pack_dir"/*.nupkg; do
            [ -f "$pkg" ] || continue
            name=$(basename "$pkg" | sed 's/\.[0-9].*//')
            echo "Installing tool $name"
            dotnet tool update -g "$name" --add-source "$pack_dir" --no-cache -v q
          done

          rm -rf "$pack_dir"
        fi

        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
