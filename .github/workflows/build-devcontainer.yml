name: Build Devcontainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          cacheFrom: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          push: always
          runCmd: dotnet --info
