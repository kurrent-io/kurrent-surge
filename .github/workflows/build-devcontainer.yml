name: Build Devcontainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.app-token.outputs.token }}

      - name: Pull base image
        run: docker pull ghcr.io/kurrent-io/devcontainers/dotnet

      - name: Build and run devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          cacheFrom: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          push: always
          runCmd: dotnet --info
