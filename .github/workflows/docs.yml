name: Docs

# Builds the Starlight site in website/ and publishes it to GitHub Pages.
# Pages serves a project site from the repository name, so `base` in
# website/astro.config.mjs must match it: a mismatch still builds green and then
# 404s on every page.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages has one live deployment. Queue pushes instead of racing them, and never
# cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Starlight's last-updated dates come from `git log` per page. A
          # shallow clone stamps every page with the deploy commit's date.
          fetch-depth: 0

      - uses: withastro/action@v6
        with:
          path: website
        env:
          SITE_URL: https://kurrent-io.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
