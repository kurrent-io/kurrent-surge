name: Docs

# Builds the Starlight site in website/ and publishes it to GitHub Pages.
# Pages serves a project site from the repository name, so SITE_BASE must match
# it: a mismatch still builds green and then 404s on every page.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages has one live deployment. Queue pushes instead of racing them, and never
# cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rehype-mermaid renders the diagrams to inline SVG through headless
      # Chromium at build time. Without the browser the build fails on every
      # page carrying a ```mermaid block.
      - uses: withastro/action@v6
        with:
          path: website
          build-cmd: bunx playwright install --with-deps chromium && bun run build
        env:
          SITE_BASE: /kurrent-surge/
          SITE_URL: https://kurrent-io.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
