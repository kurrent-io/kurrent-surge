name: Docs

# Fires the Cloudflare build hook: PR previews when docs change, and the
# post-merge build on main. Trigger-level path filters mean this workflow
# does not even start for changes outside docs/ — so its check must never
# be marked required in branch protection (it won't exist on code-only PRs).
on:
  pull_request:
    branches: [main]
    paths: ['docs/**']
  push:
    branches: [main]
    paths: ['docs/**']

permissions: {}

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    # Fork PRs receive no secrets, so the hook would be empty — skip instead of
    # failing. Outside contributors simply don't get doc previews.
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork

    steps:
      - name: Trigger Cloudflare Build
        run: curl -fsS -X POST -d '{}' "${{ secrets.CLOUDFLARE_BUILD_HOOK }}"
