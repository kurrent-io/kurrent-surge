# Build, Test and Publish Workflow
#
# This workflow handles the CI/CD pipeline for Kurrent.Client:
# - Builds and tests the code on every push to main and on PRs
# - Runs tests and outputs results to GitHub Actions interface
# - Creates and publishes NuGet packages when a tag is pushed
#
# To trigger a new package release:
# 1. Create a tag: git tag v1.0.0
# 2. Push the tag: git push origin v1.0.0
#
# The workflow will automatically build, test, and publish packages to GitHub Packages
# when tags starting with 'v' are pushed.
name: Build

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  NuGetAudit: false
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

  MinVerDefaultPreReleasePhase: alpha
  MinVerDefaultPreReleaseIdentifiers: ${{ github.event_name == 'pull_request' && format('pr.{0}.{1}', github.event.pull_request.number, github.run_number) || format('alpha.{0}', github.run_number) }}
  MinVerAutoIncrement: patch
  MinVerIgnoreHeight: true


  # MinVer : warning MINVER1008: MinVerDefaultPreReleasePhase is deprecated and will be removed in the next major version.
  # Use MinVerDefaultPreReleaseIdentifiers instead, with an additional "0" identifier.
  # For example, if you are setting MinVerDefaultPreReleasePhase to "preview", set MinVerDefaultPreReleaseIdentifiers to "preview.0" instead.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

#      - name: Login to Cloudsmith Container Registry
#        uses: docker/login-action@v3.6.0
#        with:
#          registry: docker.kurrent.io
#          username: ${{ secrets.CLOUDSMITH_CICD_USER }}
#          password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}

#      - name: Login to GitHub Container Registry
#        uses: docker/login-action@v3.6.0
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test -c Release --no-build --no-progress \
          --project test/Kurrent.Client.Tests \
          --results-directory "./artifacts/test-results" \
          --report-trx --report-trx-filename "unit-tests.trx"  \
          --treenode-filter "/*/*/*/*[Category!=Integration]"

      - name: Run Integration Tests
        run: |
          dotnet test -c Release -f net10.0 --no-build --no-progress \
          --project test/Kurrent.Client.Integration.Tests \
          --results-directory "./artifacts/test-results" \
          --report-trx --report-trx-filename "integration-tests.trx"  \
          --treenode-filter "/*/*/*/*[Category=Integration]"

      - name: Test Reports
        uses: dorny/test-reporter@v2.1.1
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: '**/artifacts/test-results/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v5.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Test Results
          path: ./artifacts/test-results
          overwrite: true
          include-hidden-files: true

