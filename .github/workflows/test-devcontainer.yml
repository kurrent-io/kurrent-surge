name: Test Devcontainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/kurrent-sdk-devcontainer
          cacheFrom: ghcr.io/kurrent-io/kurrent-sdk-devcontainer
          push: always
          runCmd: |
            echo "--- Environment ---"
            dotnet --version
            echo "--- Restore tools ---"
            dotnet tool restore
            echo "--- Restore packages ---"
            dotnet restore
            echo "--- Build ---"
            dotnet build --no-restore
