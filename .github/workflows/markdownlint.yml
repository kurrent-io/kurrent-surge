name: Markdownlint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:

    runs-on: ubuntu-latest
    # Uncomment and set to your org/user to restrict when this runs:
    # if: ${{ github.repository_owner == 'your-org' }}

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
    - name: Run Markdownlint
      run: |
        echo "::add-matcher::.github/workflows/markdownlint-problem-matcher.json"
        npm i -g markdownlint-cli@0.45.0
        markdownlint --ignore '.dotnet/' --ignore 'tools/' '**/*.md'
