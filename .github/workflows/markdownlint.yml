name: Markdownlint

permissions:
  contents: read

on:
  workflow_dispatch:
#  push:
#    branches: [main]
#  pull_request:

concurrency:
  group: markdownlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: DavidAnson/markdownlint-cli2-action@v19
