name: CI / Validate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate and Label
        uses: ./.github/actions/conventional-commits

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
