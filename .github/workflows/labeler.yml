name: Pull Request Labeler

on:
  workflow_dispatch:

  pull_request_target:
    branches: [main]

jobs:
  labeler:
    name: Pull Request Labeler
    
    runs-on: [ self-hosted, linux, x64 ]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v6
