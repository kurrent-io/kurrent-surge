name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Setup Git
        run: |
          git config user.name "${{ vars.ORG_GH_BOT_USERNAME }}"
          git config user.email "${{ vars.ORG_GH_BOT_USERNAME }}@users.noreply.github.com"

      - name: Validate version format
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must follow semantic versioning (e.g., 1.0.0)"
            exit 1
          fi

      - name: Create and push tag
        run: |
          # Create the tag with v prefix
          TAG="v${{ github.event.inputs.version }}"

          # Check if tag already exists
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Error: Tag $TAG already exists"
            exit 1
          fi

          # Create and push the tag
          git tag $TAG
          git push origin $TAG

          echo "Successfully created and pushed tag $TAG"
