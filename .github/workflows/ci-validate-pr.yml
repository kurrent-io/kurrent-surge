name: Check -- PR Title

# Runs on PR activity that could change the PR title:
#
# - opened — new PR, validate from the start
# - edited — PR title or description changed, re-validate
# - ready_for_review — draft marked ready, enforce standards before review
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Validates the PR title against the conventional commits spec.
      # The PR title becomes the commit message on main (squash merge),
      # so enforcing it here ensures every commit on main conforms.
      #
      # Valid types: feat, fix, build, chore, ci, deps, docs, infra,
      #              perf, refactor, revert, security, style, test
      #
      # Examples:
      #   feat(streaming): add bidirectional gRPC support
      #   fix: correct version stamping in nuwrap
      #   chore(deps): update NuGet dependencies
      #
      # If the title is invalid, fix it in the PR UI and the check
      # will re-run automatically (triggered by the 'edited' event).
      - name: Validate PR title
        id: pr-title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            deps
            infra
            security
            style
            revert
          # Scope is optional but must be lowercase when provided
          disallowScopes: |
            [A-Z]+
          # Subject must start lowercase and not end with a period
          subjectPattern: ^(?![A-Z]).+(?<!\.)$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a
            lowercase character and not end with a period.

      # Auto-labels the PR based on the conventional commit type in the title.
      # These labels drive the categorized release notes in .github/release.yml.
      - name: Auto-label PR
        if: steps.pr-title.outputs.type != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type="${{ steps.pr-title.outputs.type }}"
          labels=""
          case "$type" in
            feat)     labels="enhancement" ;;
            fix)      labels="bug" ;;
            docs)     labels="documentation" ;;
            perf)     labels="optimization" ;;
            deps)     labels="dependencies" ;;
            security) labels="security" ;;
          esac
          scope="${{ steps.pr-title.outputs.scope }}"
          case "$scope" in
            client|client.*) labels="${labels:+$labels,}client" ;;
            processors|processors.*) labels="${labels:+$labels,}processors" ;;
          esac
          title="${{ github.event.pull_request.title }}"
          if [[ "$title" == *"!"* ]]; then
            labels="${labels:+$labels,}breaking-change"
          fi
          if [ -n "$labels" ]; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "$labels"
          fi
