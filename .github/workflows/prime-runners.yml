name: Prime Runners

on:
  schedule:
    - cron: '0 6 * * *' # this means "At 06:00 UTC every day"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.list.outputs.runners }}
    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: List online self-hosted runners
        id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          runners=$(gh api orgs/kurrent-io/actions/runners \
            --jq '[.runners[] | select(.status == "online") | .name]')
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  warmup:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.discover.outputs.runners) }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Environment
        run: |
          echo "NuGetPackageSourceCredentials_GitHub=Username=kurrent-ci;Password=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

          # Local NuGet feed the package-validation build (-p:TestPackages=true) reads.
          # Pre-created so `dotnet restore` doesn't fail on a missing source before pack fills it.
          mkdir -p .artifacts/packages

          # Global .NET tools (e.g. Aspire.Cli) install here; not on PATH by default.
          echo "${DOTNET_INSTALL_DIR:-$HOME/.dotnet}/tools" >> "$GITHUB_PATH"

      - name: Install jq
        uses: dcarbone/install-jq-action@v3

      - name: Install yq
        uses: dcarbone/install-yq-action@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Export Repo Variables
        run: |
          echo '${{ toJSON(vars) }}' | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}<<EOF')
              print(v)
              print('EOF')
          " >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Aspire CLI
        run: |
          dotnet tool update -g Aspire.Cli
          # Pre-extract the embedded DCP/dashboard bundle so it's warm for build workflows on this runner.
          aspire setup
          {
            echo "## Aspire Doctor"
            echo '```'
            aspire doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore NuGet Packages
        run: dotnet restore --ignore-failed-sources

      - name: Pull Test Images
        uses: ./.github/actions/setup-containers
        with:
          images: ${{ env.TEST_CONTAINERS }}
          registries: |
            - registry: docker.cloudsmith.io
            - registry: docker.kurrent.io
          default-credentials: |
            username: ${{ secrets.CLOUDSMITH_CICD_USER }}
            password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}

      - name: Pull CI Images
        run: |
          images=(
            'ghcr.io/enricomi/publish-unit-test-result-action:v2.23.0'
          )
          for image in "${images[@]}"; do
            echo "Pulling $image..."
            docker pull "$image" --quiet || echo "::warning::Failed to pull $image"
          done

      - name: Clean up stale Docker resources
        run: |
          docker image prune -af --filter "until=168h"
          docker network prune -f
          docker volume prune -f
