name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint needs the PR's files, so it lives here — pr-triage.yml never checks out PR code.
  markdown:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19

  ci:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    # Zero secrets and minimal scopes: this job runs PR code, so it must hold nothing
    # worth taking. pull-requests: read is for the paths filter listing changed files.
    permissions:
      contents: read
      pull-requests: read

    steps:
      # Workaround for actions/checkout v6 bug on self-hosted runners:
      # checkout deletes the workspace contents (including .git) THEN tries
      # to run `git config --local` to clean up SSH auth from previous runs,
      # which fails with "fatal: --local can only be used inside a git
      # repository". Two mitigations:
      #   1. git init ensures a .git directory exists before checkout starts
      #   2. clean: false prevents checkout from deleting .git in the first place
      # On ephemeral GitHub-hosted runners this never matters because there's
      # no previous state to clean up. On persistent self-hosted runners, it
      # blows up without both of these.
      - name: Prepare workspace
        run: git init "${GITHUB_WORKSPACE}" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: .github/ci-path-filters.yml

      - name: Prepare Environment
        run: |
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

          # Local NuGet feed the package-validation build (-p:TestPackages=true) reads.
          # Pre-created so `dotnet restore` doesn't fail on a missing source before pack fills it.
          mkdir -p .artifacts/packages

          # On-PATH home for tools we install by hand below (e.g. yq).
          bin_dir="$HOME/.local/bin"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Global .NET tools (e.g. Aspire.Cli) install here; not on PATH by default.
          echo "${DOTNET_INSTALL_DIR:-$HOME/.dotnet}/tools" >> "$GITHUB_PATH"

          # Install yq for parsing repo variables
          if ! command -v yq &>/dev/null; then
            curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$bin_dir/yq"
            chmod +x "$bin_dir/yq"
          fi

      - name: Import Repo Variables
        run: |
          echo '${{ toJSON(vars) }}' | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}<<EOF')
              print(v)
              print('EOF')
          " >> "$GITHUB_ENV"

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Aspire CLI
        if: steps.changes.outputs.build == 'true'
        run: |
          dotnet tool update -g Aspire.Cli
          # Aspire CLI is self-extracting; `aspire setup` unpacks the embedded DCP/dashboard bundle.
          aspire setup
          # `dotnet tool` exposes aspire as a PATH symlink the SDK's bundle resolver won't follow
          # (Path.GetFullPath) -> ASPIRE009. Point it at the real binary the bundle sits beside.
          echo "AspireCliPath=$(readlink -f "$(command -v aspire)")" >> "$GITHUB_ENV"
          {
            echo "## Aspire Doctor"
            echo '```'
            aspire doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Dependencies
        if: steps.changes.outputs.build == 'true'
        run: dotnet restore --ignore-failed-sources

      - name: Install Local Tools
        if: steps.changes.outputs.build == 'true'
        uses: ./.github/actions/install-tools

      - name: Version
        if: steps.changes.outputs.build == 'true'
        id: version
        timeout-minutes: 1
        uses: ./.github/actions/bumpcraft

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack Local
        if: steps.changes.outputs.build == 'true'
        run: >-
          dotnet pack -c Release --no-build --no-restore
          -o .artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      - name: Build Examples (Package Validation)
        if: steps.changes.outputs.build == 'true'
        run: >-
          dotnet build examples/Examples.slnx -c Release
          -p:TestPackages=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Run Unit Tests
        if: steps.changes.outputs.build == 'true'
        uses: ./.github/actions/run-tests
        with:
          category: unit

      - name: Setup Containers
        if: steps.changes.outputs.build == 'true' && github.event.pull_request.draft != true
        uses: ./.github/actions/setup-containers
        with:
          registries: |
            - registry: docker.kurrent.io
          images: ${{ vars.TEST_CONTAINERS }}

      - name: Run Integration Tests
        if: steps.changes.outputs.build == 'true' && github.event.pull_request.draft != true
        uses: ./.github/actions/run-tests
        with:
          category: integration
