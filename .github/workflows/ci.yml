name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Merge queue runs are unaffected — each gets a unique ref (gh-readonly-queue/...).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  NuGetAudit: false
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

  MinVerDefaultPreReleaseIdentifiers: ${{ github.event_name == 'pull_request' && format('pr.{0}.{1}', github.event.pull_request.number, github.run_number) || format('alpha.{0}', github.run_number) }}
  MinVerAutoIncrement: patch
  MinVerIgnoreHeight: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test -c Release --no-build
          --results-directory ./artifacts/test-results
          -- --disable-logo --adaptive-metrics --report-trx --treenode-filter "/*/*/*/*[Category!=Integration]"

      - name: Integration tests
        if: github.event_name == 'merge_group'
        run: >-
          dotnet test -c Release --no-build
          --f net10.0
          --results-directory ./artifacts/test-results
          -- --disable-logo --adaptive-metrics --report-trx --fail-fast --treenode-filter "/*/*/*/*[Category=Integration]"

      - name: Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: '**/artifacts/test-results/*.trx'
          check_name: Test Results
          comment_mode: always

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack -c Release --no-build -o ./artifacts/packages

      - name: Push to GitHub Packages
        if: github.event_name == 'push'
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push ./artifacts/packages/*.nupkg \
            --skip-duplicate \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: ./artifacts
          overwrite: true
          include-hidden-files: true
