name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Merge queue runs are unaffected — each gets a unique ref (gh-readonly-queue/...).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

  MinVerDefaultPreReleaseIdentifiers: ${{ github.event_name == 'pull_request' && format('pr.{0}.{1}', github.event.pull_request.number, github.run_number) || format('alpha.{0}', github.run_number) }}
  MinVerIgnoreHeight: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/dotnet-setup
        env:
          DOTNET_INSTALL_VERSIONS: |
            8.x
            9.x
            10.x
            11.x

      - name: Version
        run: |
          version=$(minver --tag-prefix v)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "### Version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 
          --results-directory ./artifacts/test-results 
          -- --treenode-filter "/*/*/*/*[Category!=Integration]"
          --disable-logo --adaptive-metrics --report-trx --coverage 

      - name: Integration tests
        if: github.event_name == 'merge_group'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category=Integration]"
          --disable-logo --adaptive-metrics --report-trx --coverage --fail-fast  

      - name: Publish packages
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ env.VERSION }}
          push-to: github

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: ./artifacts
          overwrite: true
          include-hidden-files: true
