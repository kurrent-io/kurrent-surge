name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint
        uses: DavidAnson/markdownlint-cli2-action@v19

  ci:
    # Display name matches the required status check in branch protection.
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: .github/ci-path-filters.yml

      - name: Prepare Environment
        run: |
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

          # Local NuGet feed the package-validation build (-p:TestPackages=true) reads.
          # Pre-created so `dotnet restore` doesn't fail on a missing source before pack fills it.
          mkdir -p .artifacts/packages

          # On-PATH home for tools we install by hand below (e.g. yq).
          bin_dir="$HOME/.local/bin"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Global .NET tools (e.g. Aspire.Cli) install here; not on PATH by default.
          echo "${DOTNET_INSTALL_DIR:-$HOME/.dotnet}/tools" >> "$GITHUB_PATH"

          # yq parses registry credentials in setup-containers
          if ! command -v yq &>/dev/null; then
            curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$bin_dir/yq"
            chmod +x "$bin_dir/yq"
          fi

      - name: Import Repo Variables
        run: |
          echo '${{ toJSON(vars) }}' | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}<<EOF')
              print(v)
              print('EOF')
          " >> "$GITHUB_ENV"

      - name: Setup .NET
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Aspire CLI
        if: steps.changes.outputs.build == 'true'
        run: |
          dotnet tool update -g Aspire.Cli
          # Aspire CLI is self-extracting; `aspire setup` unpacks the embedded DCP/dashboard bundle.
          aspire setup
          # `dotnet tool` exposes aspire as a PATH symlink the SDK's bundle resolver won't follow
          # (Path.GetFullPath) -> ASPIRE009. Point it at the real binary the bundle sits beside.
          echo "AspireCliPath=$(readlink -f "$(command -v aspire)")" >> "$GITHUB_ENV"
          {
            echo "## Aspire Doctor"
            echo '```'
            # NO_COLOR for the CLI's own output; sed strips ANSI codes the underlying
            # tools emit anyway — step summaries render escapes as garbage otherwise.
            NO_COLOR=1 aspire doctor | sed -E $'s/\x1b\\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Dependencies
        if: steps.changes.outputs.build == 'true'
        run: dotnet restore --ignore-failed-sources

      - name: Version
        if: steps.changes.outputs.build == 'true'
        id: version
        timeout-minutes: 1
        uses: ./.github/actions/bumpcraft

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack Local
        if: steps.changes.outputs.build == 'true'
        run: >-
          dotnet pack -c Release --no-build --no-restore
          -o .artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      - name: Build Examples (Package Validation)
        if: steps.changes.outputs.build == 'true'
        # The packed SDK packages carry this build's version and exist ONLY in the local
        # .artifacts/packages feed, which nuget.config disables by default. Enable it here.
        run: |
          dotnet nuget enable source local
          dotnet build examples/Examples.slnx -c Release \
            -p:TestPackages=true \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Run Unit Tests
        if: steps.changes.outputs.build == 'true'
        uses: ./.github/actions/run-tests
        with:
          category: unit

      - name: Setup Containers
        if: steps.changes.outputs.build == 'true' && github.event.pull_request.draft != true
        uses: ./.github/actions/setup-containers
        with:
          registries: |
            - registry: docker.kurrent.io
          images: ${{ vars.TEST_CONTAINERS }}

      - name: Run Integration Tests
        if: steps.changes.outputs.build == 'true' && github.event.pull_request.draft != true
        uses: ./.github/actions/run-tests
        with:
          category: integration

      # Runs after tests so no Aspire session is active on this runner; reaping
      # mid-session corrupts DCP state. Skipped on cancellation — a superseding
      # run may already be spinning up on this runner.
      - name: Cleanup Containers
        if: ${{ !cancelled() && steps.changes.outputs.build == 'true' && github.event.pull_request.draft != true }}
        uses: ./.github/actions/cleanup-containers
        with:
          max-age-hours: 72
