name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g., 1.0.0). Leave empty to compute from conventional commits.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Compute version and build without tagging or publishing'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configure NuGet Credentials
        run: echo "NuGetPackageSourceCredentials_GitHub=Username=kurrent-ci;Password=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Build
        uses: ./.github/actions/dotnet-setup

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft
        with:
          mode: release
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Tag
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish Packages
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/publish-packages
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github nuget
        env:
          NUGET_API_KEY: ${{ secrets.KURRENT_NUGET_KEY }}

      - name: Create Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ./artifacts/packages/*.nupkg \
            ./artifacts/packages/*.snupkg
