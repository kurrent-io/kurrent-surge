name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g., 1.0.0). Leave empty to compute from conventional commits.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Compute version and build without tagging or publishing'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          echo "NuGetPackageSourceCredentials_GitHub=Username=kurrent-ci;Password=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

          # Local NuGet feed the package-validation build (-p:TestPackages=true) reads.
          # Pre-created so `dotnet restore` doesn't fail on a missing source before pack fills it.
          mkdir -p .artifacts/packages

          # On-PATH home for tools we install by hand below (e.g. yq).
          bin_dir="$HOME/.local/bin"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Global .NET tools (e.g. Aspire.Cli) install here; not on PATH by default.
          echo "${DOTNET_INSTALL_DIR:-$HOME/.dotnet}/tools" >> "$GITHUB_PATH"

          # jq parses semver-bump's JSON output in bumpcraft
          if ! command -v jq &>/dev/null; then
            curl -fsSL "https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64" -o "$bin_dir/jq"
            chmod +x "$bin_dir/jq"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Aspire CLI
        run: |
          dotnet tool update -g Aspire.Cli
          # Aspire CLI is self-extracting; `aspire setup` unpacks the embedded DCP/dashboard bundle.
          aspire setup
          # `dotnet tool` exposes aspire as a PATH symlink the SDK's bundle resolver won't follow
          # (Path.GetFullPath) -> ASPIRE009. Point it at the real binary the bundle sits beside.
          echo "AspireCliPath=$(readlink -f "$(command -v aspire)")" >> "$GITHUB_ENV"
          {
            echo "## Aspire Doctor"
            echo '```'
            aspire doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Dependencies
        run: dotnet restore --ignore-failed-sources

      - name: Install Local Tools
        uses: ./.github/actions/install-tools

      - name: Version
        id: version
        timeout-minutes: 1
        uses: ./.github/actions/bumpcraft
        with:
          mode: release
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Tag
        if: github.ref_type != 'tag' && !inputs.dry_run
        uses: actions/github-script@v7
        with:
          # GITHUB_TOKEN, not app token: a tag pushed with it won't re-trigger this workflow
          github-token: ${{ github.token }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG}`,
              sha: context.sha,
            });
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: NuGet Trusted Publishing Login
        id: nuget-login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish Packages
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/publish-packages
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: nuget
          nuget-api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Create Release
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: process.env.IS_PRE_RELEASE === 'true',
            });

            const dir = '.artifacts/packages';
            const assets = fs.readdirSync(dir).filter(f => f.endsWith('.nupkg') || f.endsWith('.snupkg'));
            for (const name of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data: fs.readFileSync(path.join(dir, name)),
              });
            }
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRE_RELEASE: ${{ steps.version.outputs['is-pre-release'] }}
