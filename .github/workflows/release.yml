name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g., 1.0.0). Leave empty to compute from conventional commits.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Compute version and build without tagging or publishing'
        required: false
        type: boolean
        default: false

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build project
        uses: ./.github/actions/dotnet-setup

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft
        with:
          mode: release
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github nuget
        env:
          NUGET_API_KEY: ${{ secrets.KURRENT_NUGET_KEY }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ./artifacts/packages/*.nupkg \
            ./artifacts/packages/*.snupkg
