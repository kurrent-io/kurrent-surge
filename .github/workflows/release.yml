name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g., 1.0.0). Leave empty to compute from conventional commits.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Compute version and build without tagging or publishing'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          echo "NuGetPackageSourceCredentials_GitHub=Username=kurrent-ci;Password=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Install Local Tools
        uses: ./.github/actions/install-tools

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft
        with:
          mode: release
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Tag
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish Packages
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/publish-packages
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github
        env:
          NUGET_API_KEY: ${{ secrets.KURRENT_NUGET_KEY }}

      - name: Create Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ./artifacts/packages/*.nupkg \
            ./artifacts/packages/*.snupkg
