name: Build and Test PRs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  NuGetPackageSourceCredentials_GitHub: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

jobs:
  ci:
    name: Build and Test

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect source changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            source:
              - '**'
              - '!docs/**'
              - '!examples/**'
              - '!perf/**'
              - '!scripts/**'
              - '!tools/**'
              - '!playground/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.devcontainer/**'
              - '!.github/**'
              - '.github/actions/**'
              - '!.idea/**'
              - '!.junie/**'
              - '!.project/**'
              - '!.vscode/**'

      - name: Build
        if: steps.changes.outputs.source != 'false'
        uses: ./.github/actions/dotnet-setup

      - name: Run Tests - Unit
        if: steps.changes.outputs.source != 'false'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category!=Integration]"
          --disable-logo --report-trx --coverage

      - name: Test Containers Setup
        if: steps.changes.outputs.source != 'false' && github.event.pull_request.draft != true
        uses: ./.github/actions/test-containers-setup
        with:
          default-credentials: |
            username: ${{ secrets.CLOUDSMITH_CICD_USER }}
            password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}
          registries: |
            - registry: docker.cloudsmith.io
            - registry: docker.kurrent.io
            - registry: docker.eventstore.com
          images: |
            KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly

      - name: Run Tests - Integration
        if: steps.changes.outputs.source != 'false' && github.event.pull_request.draft != true
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category=Integration]"
          --disable-logo --report-trx --coverage --fail-fast

      - name: Version
        id: version
        if: github.event_name == 'pull_request' && steps.changes.outputs.source != 'false'
        uses: ./.github/actions/bumpcraft

      - name: Publish Packages
        if: github.event_name == 'pull_request' && steps.changes.outputs.source != 'false'
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: |
            ./artifacts
            **/*-report.html
          overwrite: true
          include-hidden-files: true
