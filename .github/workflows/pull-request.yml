name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, ready_for_review]
  pull_request_target:
    branches: [main]
  merge_group:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Merge queue runs are unaffected — each gets a unique ref (gh-readonly-queue/...).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

jobs:
  ci:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET & Restore
        uses: ./.github/actions/dotnet-setup
        env:
          DOTNET_INSTALL_VERSIONS: 10.x

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category!=Integration]"
          --disable-logo --adaptive-metrics --report-trx --coverage

      - name: Integration tests
        if: github.event_name == 'merge_group'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category=Integration]"
          --disable-logo --adaptive-metrics --report-trx --coverage --fail-fast

      - name: Version
        id: version
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bumpcraft

      - name: Publish PR packages
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: ./artifacts
          overwrite: true
          include-hidden-files: true

  validate:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","edited","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and Label
        uses: ./.github/actions/conventional-commits

  labeler:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v6
