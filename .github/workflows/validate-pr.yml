name: Validate PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  validate:
    name: Validate PR Title

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and Label
        uses: ./.github/actions/conventional-commits
