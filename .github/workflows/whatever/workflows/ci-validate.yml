name: Validate

# Runs on all PR activity that could change either the PR title or the commits:
#
# - opened          — new PR, validate everything from the start
# - edited          — PR title or description changed, re-validate title
# - ready_for_review — draft marked ready, enforce standards before review
# - synchronize     — new commits pushed, re-validate commit messages
on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      # Required to read PR details (title, commits)
      pull-requests: read

    steps:
      # Validates every commit message in the PR branch against conventional commits.
      # Only commits added by this PR are checked — not the entire history.
      #
      # Rules enforced (conventional commits spec):
      #   type(scope): description
      #
      # Valid types: feat, fix, docs, chore, refactor, perf, test, build, ci, revert
      #
      # Examples:
      #   feat(auth): add OAuth2 support
      #   fix(api): handle null response from upstream
      #   chore: bump dependencies
      #
      # Fails the PR if any commit message does not conform. Developers can
      # amend or rebase their commits to fix messages before merge.
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

      # Validates the PR title against the same conventional commits spec.
      # The PR title becomes the merge commit message when squash-merging or
      # merging via the merge queue — enforcing it here ensures every commit
      # on main is a valid conventional commit automatically.
      #
      # Examples of valid PR titles:
      #   feat(streaming): add bidirectional gRPC support
      #   fix: correct version stamping in nuwrap
      #   chore(deps): update NuGet dependencies
      #
      # If the title is invalid, fix it in the PR UI and the check will re-run
      # automatically (triggered by the 'edited' event above).
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            revert
