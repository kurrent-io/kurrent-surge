name: CI

# Triggered in three ways:
#
# 1. pull_request (ready_for_review, synchronize) — runs on every push to a PR
#    and when a draft is marked ready. Runs unit tests and packs a PR-versioned
#    pre-release (e.g. 1.2.3-pr.42.3) pushed to GitHub Packages for local testing.
#
# 2. merge_group — runs when a PR enters the merge queue. Skips unit tests
#    (already passed on the PR) and runs integration tests instead as the
#    final gate before merge.
#
# 3. push to main / workflow_dispatch — runs after a PR is merged. Same as PR
#    but uses the default MinVer pre-release phase (alpha), generates a nuwrap.yml
#    artifact capturing the exact package versions built, and uploads it for use
#    by the release workflow.
#
#    If the merged PR had the 'ship-it' label, release.yml is triggered
#    automatically after a successful build.
on:
  pull_request:
    types: [ready_for_review, synchronize]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required to read the repo
      contents: read
      # Required to push pre-release packages to GitHub Packages
      packages: write
      # Required to trigger release.yml via gh workflow run
      actions: write

    steps:
      # fetch-depth: 0 is required by MinVer — it needs the full git history
      # to walk back to the nearest version tag and calculate height.
      # Without it, MinVer falls back to 0.0.0-alpha.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # All three SDKs are installed to support multi-TFM testing (net8.0, net9.0, net10.0).
      # The project targets all three and tests must pass on each.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      # NuGet package cache keyed on all .csproj files and the central package
      # versions file (Directory.Packages.props). Cache is invalidated when any
      # dependency version changes. Speeds up restore on repeat runs significantly.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Unit tests run on PR and main pushes but are skipped on merge_group.
      # By the time a PR enters the merge queue, unit tests have already passed —
      # re-running them would be redundant and slow down the queue unnecessarily.
      - name: Unit tests
        if: github.event_name != 'merge_group'
        run: dotnet test --no-build -c Release --logger trx --results-directory test-results

      # Integration tests only run in the merge queue — they are the final gate
      # before code lands on main. Running them on every PR push would be too slow;
      # the merge queue is the right place for heavier validation.
      - name: Integration tests
        if: github.event_name == 'merge_group'
        run: dotnet test --no-build -c Release --filter Category=Integration --logger trx --results-directory test-results

      # Packs all projects with IsPackable=true and pushes them to GitHub Packages.
      #
      # Version is controlled by MinVer via MINVERDEFAULTPRERELEASEPHASE:
      #
      #   pull_request → pr.{PR_NUMBER}  e.g. 1.2.3-pr.42.3
      #                  PR number makes packages traceable to their PR.
      #                  Height (the trailing .3) increments on every push,
      #                  ensuring versions are always increasing within a PR.
      #
      #   push/dispatch → alpha (MinVer default)  e.g. 1.2.3-alpha.0.5
      #                   Standard pre-release for packages built from main.
      #                   These are the candidates that release.yml promotes.
      #
      #   merge_group   → alpha (same as main push)
      #                   Merge group builds don't need distinct versioning;
      #                   only the post-merge build on main matters for promotion.
      #
      # --skip-duplicate prevents failures when the same version is pushed twice
      # (e.g. workflow_dispatch re-run on the same commit).
      - name: Pack and push to GitHub Packages
        env:
          MINVERDEFAULTPRERELEASEPHASE: ${{ github.event_name == 'pull_request' && format('pr.{0}', github.event.pull_request.number) || 'alpha' }}
        run: |
          dotnet pack --no-build -c Release -o packages
          dotnet nuget push packages/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # Generates a nuwrap.yml capturing the exact pre-release versions built in
      # this run. Only runs on main pushes and workflow_dispatch — PR and merge_group
      # builds are not release candidates so no artifact is needed.
      #
      # Output format:
      #   packages:
      #     - Kurrent.Sdk@1.2.3-alpha.0.5
      #     - Kurrent.Processors@1.2.3-alpha.0.5
      #
      # The release workflow downloads this artifact and passes it to nuwrap,
      # which uses the pinned versions to download and stamp the exact packages
      # that were built and validated here — not whatever happens to be latest.
      - name: Generate nuwrap config
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "packages:" > nuwrap.yml
          for pkg in packages/*.nupkg; do
            filename=$(basename "$pkg" .nupkg)
            version=$(echo "$filename" | grep -oP '\d+\.\d+\.\d+.*$')
            id="${filename%.$version}"
            echo "  - ${id}@${version}" >> nuwrap.yml
          done

      # Uploads all artifacts in a single step at the end:
      #
      # test-results/ — TRX files from unit and integration test runs.
      #                 Uploaded with if: always() so results are available
      #                 even when tests fail, which is when you need them most.
      #
      # nuwrap.yml    — Only present on main/workflow_dispatch runs (generated above).
      #                 On PR and merge_group runs the file doesn't exist and is
      #                 silently skipped by upload-artifact (at least one path must match).
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            test-results/
            nuwrap.yml
          retention-days: 90

      # Checks if the PR that triggered this push to main had the 'ship-it' label.
      # If so, triggers release.yml automatically — no manual intervention needed.
      #
      # Uses the GitHub CLI (pre-installed on all GitHub Actions runners) to:
      # 1. Find the PR associated with the merge commit via the GitHub API
      # 2. Check if it has the 'ship-it' label
      # 3. Trigger release.yml via workflow_dispatch if it does
      #
      # The bump input defaults to 'patch' — to release a minor or major version,
      # trigger release.yml manually with the appropriate bump input instead.
      #
      # Only runs on push to main — PR, merge_group, and workflow_dispatch events
      # are not merge events and should never trigger a release.
      - name: Trigger release if ship-it
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --state merged \
            --base main \
            --search "${{ github.sha }}" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found for this commit — skipping release trigger"
            exit 0
          fi

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          echo "PR #$PR_NUMBER labels: $LABELS"

          if echo "$LABELS" | grep -q "ship-it"; then
            echo "ship-it label found — triggering release"
            gh workflow run release.yml --field bump=patch
          else
            echo "No ship-it label — skipping release"
          fi
