name: Build and Test

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  IS_DIRECT_PUSH: ${{ github.event.head_commit.committer.username != 'web-flow' }}

jobs:
  main:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build project
        uses: ./.github/actions/dotnet-setup

      # Tests only run on direct push — merged PRs were already validated by CI
      - name: Unit tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category!=Integration]"
          --disable-logo --report-trx --coverage

      - name: Test containers setup
        if: env.IS_DIRECT_PUSH == 'true'
        uses: ./.github/actions/test-containers-setup
        with:
          default-credentials: |
            username: ${{ secrets.CLOUDSMITH_CICD_USER }}
            password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}
          registries: |
            - registry: docker.cloudsmith.io
            - registry: docker.kurrent.io
            - registry: docker.eventstore.com
          images: |
            KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly

      - name: Integration tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category=Integration]"
          --disable-logo --report-trx --coverage --fail-fast

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft

      - name: Publish preview packages
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github nuget
        env:
          NUGET_API_KEY: ${{ secrets.KURRENT_NUGET_KEY }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: |
            ./artifacts
            **/*-report.html
          overwrite: true
          include-hidden-files: true
