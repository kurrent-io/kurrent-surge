name: Build and Test

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  NuGetPackageSourceCredentials_GitHub: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  IS_DIRECT_PUSH: ${{ github.event.head_commit.committer.username != 'web-flow' }}
  TUNIT_DISABLE_HTML_REPORTER: true

jobs:
  main:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Resolve environment defaults so subsequent steps can reference them.
      # DOTNET_MULTILEVEL_LOOKUP=0 prevents the SDK from probing system-wide installs.
      - name: Prepare Environment
        run: |
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

      - name: Expose Artifact Upload Token
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore Dependencies
        run: dotnet restore ${{ inputs.restore-args }}

      - name: Restore Tools
        uses: ./.github/actions/dotnet-tools

      - name: Build
        run: dotnet build -c Release --no-restore

      # Tests only run on direct push — merged PRs were already validated by CI
      - name: Run Unit Tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8
          --results-directory .artifacts/test-results/unit
          --
          --disable-logo
          --treenode-filter "/*/*/*/*[Category!=Integration]"
          --coverage --coverage-output "unit-tests-report.cobertura"
          --report-trx --report-trx-filename "unit-tests-report.trx"

      - name: Generate Unit Test Report
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        run: |
          trx=".artifacts/test-results/unit/unit-tests-report.trx"
          html=".artifacts/test-results/unit/unit-tests-report.html"
          [ -f "$trx" ] && TrxToExtentReport -t "$trx" -o "$html" -e "CI" || true

      - name: (Experiment) Generate Unit Test Report via dnx
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        continue-on-error: true
        run: |
          trx=".artifacts/test-results/unit/unit-tests-report.trx"
          html=".artifacts/test-results/unit/unit-tests-report-dnx.html"
          [ -f "$trx" ] && dnx TrxToExtentReport -y --allow-roll-forward -- -t "$trx" -o "$html" -e "CI" || true

      - name: Upload Unit Test Report
        id: unit-report
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        uses: ./.github/actions/upload-html-report
        with:
          file: .artifacts/test-results/unit/unit-tests-report.html
          name: unit-test-report

      - name: Test Containers Setup
        if: env.IS_DIRECT_PUSH == 'true'
        uses: ./.github/actions/test-containers-setup
        with:
          default-credentials: |
            username: ${{ secrets.CLOUDSMITH_CICD_USER }}
            password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}
          registries: |
            - registry: docker.cloudsmith.io
            - registry: docker.kurrent.io
            - registry: docker.eventstore.com
          images: |
            KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly

      - name: Run Integration Tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory .artifacts/test-results/integration
          --
          --disable-logo
          --treenode-filter "/*/*/*/*[Category=Integration]"
          --coverage --coverage-output "integration-tests-report.cobertura"
          --report-trx --report-trx-filename "integration-tests-report.trx"
          --fail-fast

      - name: Generate Integration Test Report
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        run: |
          trx=".artifacts/test-results/integration/integration-tests-report.trx"
          html=".artifacts/test-results/integration/integration-tests-report.html"
          [ -f "$trx" ] && TrxToExtentReport -t "$trx" -o "$html" -e "CI" || true

      - name: Upload Integration Test Report
        id: integration-report
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        uses: ./.github/actions/upload-html-report
        with:
          file: .artifacts/test-results/integration/integration-tests-report.html
          name: integration-test-report

      - name: Test Report Summary
        if: env.IS_DIRECT_PUSH == 'true' && !cancelled()
        run: |
          echo "## Test Reports" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.unit-report.outputs.url }}" ]; then
            echo "- [Unit Test Report](${{ steps.unit-report.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.integration-report.outputs.url }}" ]; then
            echo "- [Integration Test Report](${{ steps.integration-report.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft

      - name: Publish Preview Packages
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: .artifacts
          overwrite: true
          include-hidden-files: true
