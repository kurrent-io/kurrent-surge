name: Build and Test

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  NuGetPackageSourceCredentials_GitHub: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}
  IS_DIRECT_PUSH: ${{ github.event.head_commit.committer.username != 'web-flow' }}

jobs:
  main:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read
      issues: read
      packages: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

#      - name: Build
#        uses: ./.github/actions/dotnet-setup
      
      # Resolve environment defaults so subsequent steps can reference them.
      # DOTNET_MULTILEVEL_LOOKUP=0 prevents the SDK from probing system-wide installs.
      - name: Prepare environment
        run: |
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.x

      - name: Restore Dependencies
        run: dotnet restore ${{ inputs.restore-args }}

      - name: Restore Tools
        uses: ./.github/actions/dotnet-tools

      - name: Build
        run: dotnet build -c Release --no-restore

      # Tests only run on direct push — merged PRs were already validated by CI
      - name: Run Unit Tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category!=Integration]"
          --disable-logo --report-trx --coverage

      - name: Test Containers Setup
        if: env.IS_DIRECT_PUSH == 'true'
        uses: ./.github/actions/test-containers-setup
        with:
          default-credentials: |
            username: ${{ secrets.CLOUDSMITH_CICD_USER }}
            password: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}
          registries: |
            - registry: docker.cloudsmith.io
            - registry: docker.kurrent.io
            - registry: docker.eventstore.com
          images: |
            KurrentDB: docker.kurrent.io/kurrent-staging/kurrentdb:nightly

      - name: Run Integration Tests
        if: env.IS_DIRECT_PUSH == 'true'
        run: >-
          dotnet test -c Release --no-build --no-progress --ignore-exit-code 8 -f net10.0
          --results-directory ./artifacts/test-results
          -- --treenode-filter "/*/*/*/*[Category=Integration]"
          --disable-logo --report-trx --coverage --fail-fast

      - name: Version
        id: version
        uses: ./.github/actions/bumpcraft

      - name: Publish Preview Packages
        uses: ./.github/actions/dotnet-nuget
        with:
          version: ${{ steps.version.outputs.version }}
          push-to: github

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: artifacts
          path: |
            ./artifacts
            **/*-report.html
          overwrite: true
          include-hidden-files: true
