name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  NuGetAudit: false
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

  MinVerDefaultPreReleaseIdentifiers: ${{ github.event_name == 'pull_request' && format('pr.{0}.{1}', github.event.pull_request.number, github.run_number) || format('alpha.{0}', github.run_number) }}
  MinVerAutoIncrement: patch
  MinVerIgnoreHeight: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Detect external changes
        uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            external:
              - 'proto/**'
            infra:
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'global.json'
              - '*.slnx'
              - 'nuget.config'

      - name: Determine build scope
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || \
             [[ "${{ steps.changes.outputs.external }}" == "true" ]] || \
             [[ "${{ steps.changes.outputs.infra }}" == "true" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi
          echo "Build scope: $(grep mode "$GITHUB_OUTPUT")"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Preview affected projects
        if: steps.scope.outputs.mode == 'incremental'
        run: dotnet incrementalist run --dry --verbose -c .incrementalist/incrementalist.json

      # --- Unit Tests ---

      - name: Detect affected unit tests
        if: steps.scope.outputs.mode == 'incremental'
        run: ./scripts/ci/detect-affected.sh .incrementalist/testsOnly.json affected-unit-tests.txt

      - name: Run unit tests
        run: >-
          ./scripts/ci/run-tests.sh affected-unit-tests.txt
          --runner run
          --frameworks net8.0,net9.0,net10.0
          --no-build
          --fallback-name "*.Tests.csproj"
          --fallback-not-name "*.Integration.Tests.csproj"
          --fallback-dir test
          --extra-args "--no-progress --treenode-filter '/*/*/*/*[Category!=Integration]'"

      # --- Integration Tests ---

      - name: Detect affected integration tests
        if: steps.scope.outputs.mode == 'incremental'
        run: ./scripts/ci/detect-affected.sh .incrementalist/integrationOnly.json affected-integration-tests.txt

      - name: Run integration tests
        run: >-
          ./scripts/ci/run-tests.sh affected-integration-tests.txt
          --runner run
          --frameworks net10.0
          --no-build
          --fallback-name "*.Integration.Tests.csproj"
          --fallback-dir test
          --extra-args "--no-progress --treenode-filter '/*/*/*/*[Category=Integration]'"

      # --- Reporting ---

      - name: Test Reports
        uses: dorny/test-reporter@v2.6.0
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: '**/artifacts/test-results/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Test Results
          path: ./artifacts/test-results
          overwrite: true
          include-hidden-files: true

      # --- Package (main only) ---

      - name: Pack
        if: github.ref == 'refs/heads/main'
        run: dotnet pack --configuration Release --no-build -o ./artifacts/packages

      - name: Push to GitHub Packages
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push ./artifacts/packages/*.nupkg \
            --skip-duplicate \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }}
