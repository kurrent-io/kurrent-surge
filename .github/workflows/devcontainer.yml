name: Build Devcontainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Self-hosted runners may have root-owned artifacts from previous
      # Docker-based builds. Clean the workspace via a container since
      # the runner user has no sudo.
      - name: Clean workspace
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" alpine \
            sh -c "rm -rf /workspace/* /workspace/.[!.]* 2>/dev/null; chown -R $(id -u):$(id -g) /workspace" || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +'%y%j').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Import Repo Variables
        run: |
          echo '${{ toJSON(vars) }}' | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}<<EOF')
              print(v)
              print('EOF')
          " >> "$GITHUB_ENV"

      # The devcontainers/ci action runs `npm install -g @devcontainers/cli`,
      # which fails with EACCES on self-hosted runners that don't run as root.
      # Redirect npm's global prefix to a user-writable directory.
      - name: Configure npm global prefix
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Build & Push
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          imageTag: ${{ steps.tag.outputs.value }}
          push: always
          # runCmd triggers `devcontainer up` (which runs lifecycle commands
          # including verify.sh via postCreateCommand) instead of just
          # `devcontainer build` which only builds the image.
          runCmd: echo "Container lifecycle complete"
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            NUGET_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
