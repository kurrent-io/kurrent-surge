name: Build Devcontainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # TODO: Remove after runners are clean. Earlier workflow runs left
      # root-owned .nuget/ dirs from Docker volume mounts in the workspace.
      - name: Fix stale workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.nuget" ]; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" alpine \
              rm -rf /workspace/.nuget 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Repo Variables
        run: echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)<<EOF\n\(.value)\nEOF"' >> $GITHUB_ENV

      - name: Build & Push
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          cacheFrom: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          push: always
          inheritEnv: true
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            NUGET_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
