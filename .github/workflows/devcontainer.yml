name: Build Devcontainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/devcontainer.json'
  workflow_dispatch:

concurrency:
  group: build-devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Previous devcontainer builds create root-owned directories in the workspace
      # via Docker named volumes (.nuget/packages, .nuget/http-cache). The checkout
      # action runs as the unprivileged runner user and cannot remove them.
      - name: Clean workspace
        run: sudo rm -rf "${GITHUB_WORKSPACE}" && mkdir -p "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ghcr.io/kurrent-io/devcontainers/dotnet

      # The devcontainers/ci action runs `npm install -g @devcontainers/cli`,
      # which fails with EACCES on self-hosted runners that don't run as root.
      # Redirect npm's global prefix to a user-writable directory so the
      # action's own global install succeeds without sudo.
      - name: Configure npm global prefix
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Build & Push
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          cacheFrom: ghcr.io/kurrent-io/devcontainers/repos/kurrent-sdk
          skipContainerUserIdUpdate: true
          push: always
          env: |
            NUGET_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: dotnet --info
