name: Run Benchmarks

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]
    paths:
      - 'perf/**'

jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request'
      || github.event.label.name == 'run-benchmarks'

    strategy:
      fail-fast: false
      matrix:
        include:
          - category: general
            filter: '"*ExpressionFilter*" "*XXHash*"'
          - category: reads
            filter: '"*Read*"'

    name: benchmark (${{ matrix.category }})
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KURRENT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KURRENT_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare Environment
        run: |
          echo "NuGetPackageSourceCredentials_GitHub=Username=kurrent-ci;Password=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=${DOTNET_INSTALL_DIR:-$HOME/.dotnet}" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=${NUGET_PACKAGES:-$HOME/.nuget/packages}" >> $GITHUB_ENV
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> $GITHUB_ENV

          # Local NuGet feed the package-validation build (-p:TestPackages=true) reads.
          # Pre-created so `dotnet restore` doesn't fail on a missing source before pack fills it.
          mkdir -p .artifacts/local-packages

          # On-PATH home for tools we install by hand below (e.g. yq).
          bin_dir="$HOME/.local/bin"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Global .NET tools (e.g. Aspire.Cli) install here; not on PATH by default.
          echo "${DOTNET_INSTALL_DIR:-$HOME/.dotnet}/tools" >> "$GITHUB_PATH"

          # Install yq for parsing repo variables
          if ! command -v yq &>/dev/null; then
            curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$bin_dir/yq"
            chmod +x "$bin_dir/yq"
          fi

      - name: Export Repo Variables
        run: |
          echo '${{ toJSON(vars) }}' | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}<<EOF')
              print(v)
              print('EOF')
          " >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Aspire CLI
        run: |
          dotnet tool update -g Aspire.Cli
          {
            echo "## Aspire Doctor"
            echo '```'
            aspire doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Dependencies
        run: dotnet restore --ignore-failed-sources

      - name: Install Local Tools
        uses: ./.github/actions/install-tools

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run Benchmarks
        run: >-
          dotnet run -c Release --no-build --framework net10.0 --project perf/Kurrent.Client.Benchmarks/ --
          --artifacts ./artifacts/benchmarks
          --exporters json github
          --filter ${{ matrix.filter }}

      - name: Generate report
        run: >-
          dotnet run tools/benchmark-report.cs --
          --input ./artifacts/benchmarks
          --output ./artifacts/benchmarks/report.html

      - name: Write summary
        run: |
          echo "## Benchmark Results (${{ matrix.category }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for report in ./artifacts/benchmarks/results/*-report-github.md; do
            if [ -f "$report" ]; then
              echo "### $(basename "$report" | sed 's/-report-github.md//')" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "---" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "Download the full benchmark results from artifacts for the HTML report." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Benchmark Results (${{ matrix.category }})
          path: ./artifacts/benchmarks
          overwrite: true
