name: Run Benchmarks

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'perf/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NuGetAudit: false
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

jobs:
  benchmark:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run benchmarks
        run: >-
          dotnet run -c Release --no-build --framework net10.0 --project perf/Kurrent.Client.Benchmarks/ --
          --artifacts ./artifacts/benchmarks
          --exporters json github
          --filter "*"

      - name: Generate report
        run: >-
          dotnet run tools/benchmark-report.cs --
          --input ./artifacts/benchmarks
          --output ./artifacts/benchmarks/report.html

      - name: Write summary
        run: |
          echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for report in ./artifacts/benchmarks/results/*-report-github.md; do
            if [ -f "$report" ]; then
              echo "### $(basename "$report" | sed 's/-report-github.md//')" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "---" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "Download the full benchmark results from artifacts for the HTML report." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Benchmark Results
          path: ./artifacts/benchmarks
          overwrite: true
