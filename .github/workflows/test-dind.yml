name: Test Docker-in-Docker

on:
  workflow_dispatch:

jobs:
  test-dind:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check Docker
        run: |
          echo "--- Docker version ---"
          docker version
          echo "--- Docker info ---"
          docker info
          echo "--- Running container ---"
          docker run --rm hello-world
          echo "--- Running nested docker ---"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker:cli docker ps

  test-container-job:
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:22-alpine
    steps:
      - name: Check environment
        run: |
          echo "--- Node version ---"
          node --version
          echo "--- OS ---"
          cat /etc/os-release
          echo "--- whoami ---"
          whoami
