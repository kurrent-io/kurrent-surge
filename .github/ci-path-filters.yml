# Triggers build + test + publish
build:
  - 'src/**'
  - 'test/**'
  - 'proto/**'
  - 'Directory.Build.props'
  - 'Directory.Packages.props'
  - 'global.json'
  - 'nuget.config'
  - '.github/actions/**'

# Individual change categories for finer gating
client:
  - 'src/Kurrent.Client/**'
  - 'src/Kurrent.Client.SourceGenerators/**'
  - 'src/Kurrent.CodeAnalysis/**'
  - 'src/Variant/**'
  - 'src/Variant.SourceGenerators/**'
  - 'test/Kurrent.Client.Tests/**'
  - 'test/Kurrent.CodeAnalysis.Tests/**'
  - 'test/Variant.Tests/**'

streaming:
  - 'src/Kurrent.Streaming/**'
  - 'test/Kurrent.Streaming.Tests/**'

tests:
  - 'test/**'

testing-infra:
  - 'test/Kurrent.Testkit/**'
  - 'test/Kurrent.Testkit.Datasets/**'
  - 'test/Kurrent.Sdk.Testkit/**'
  - 'test/Aspire.Hosting.KurrentDB/**'
  - 'test/Aspire.Hosting.KurrentDB.Tests/**'

ci:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/labeler.yml'
  - '.github/ci-path-filters.yml'

docs:
  - 'docs/**'
  - 'examples/**'
  - 'README.md'
  - 'CONTRIBUTING.md'
  - 'LICENSE.md'

tooling:
  - 'tools/**'
  - 'scripts/**'


perf:
  - 'perf/**'
