name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  NuGetAudit: false
  NuGetPackageSourceCredentials_KurrentDB: Username=${{ vars.ORG_GH_BOT_USERNAME }};Password=${{ secrets.ORG_GH_BOT_AUTOMATION }}

  MinVerDefaultPreReleaseIdentifiers: ${{ github.event_name == 'pull_request' && format('pr.{0}.{1}', github.event.pull_request.number, github.run_number) || format('alpha.{0}', github.run_number) }}
  MinVerAutoIncrement: patch
  MinVerIgnoreHeight: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run Unit Tests
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            dotnet run --project test/Kurrent.Client.Tests \
              --configuration Release --no-build --framework $tfm -- \
              --no-progress \
              --results-directory "./artifacts/test-results" \
              --report-trx --report-trx-filename "unit-tests-$tfm.trx" \
              --treenode-filter "/*/*/*/*[Category!=Integration]"
          done

      - name: Run Integration Tests
        run: |
          dotnet run --project test/Kurrent.Client.Integration.Tests \
            --configuration Release --no-build --framework net10.0 -- \
            --no-progress \
            --results-directory "./artifacts/test-results" \
            --report-trx --report-trx-filename "integration-tests.trx" \
            --treenode-filter "/*/*/*/*[Category=Integration]"

      - name: Test Reports
        uses: dorny/test-reporter@v2.6.0
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: '**/artifacts/test-results/*.trx'
          reporter: dotnet-trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Test Results
          path: ./artifacts/test-results
          overwrite: true
          include-hidden-files: true

      - name: Pack
        if: github.ref == 'refs/heads/main'
        run: dotnet pack --configuration Release --no-build -o ./artifacts/packages

      - name: Push to GitHub Packages
        if: github.ref == 'refs/heads/main'
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push ./artifacts/packages/*.nupkg \
            --skip-duplicate \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }}
