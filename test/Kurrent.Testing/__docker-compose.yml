services:
  seq:
    image: datalust/seq:latest
    pull_policy: always
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    volumes:
      - seq-data:/data
    ports:
      - "5341:80"
    networks:
      - kurrentdb-net

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    pull_policy: always
    container_name: dashboard
    restart: unless-stopped
    environment:
      - ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPIRE_ALLOW_UNSECURED_TRANSPORT=true
    ports:
      - "18888:18888" # Dashboard UI
      - "4317:18889"  # OTLP/gRPC ingestion
      - "4318:18890"  # OTLP/HTTP Protobuf ingestion
      - "18891:18891" # MCP server
    networks:
      - kurrentdb-net

volumes:
  seq-data:
    name: seq-data

networks:
  kurrentdb-net:
    name: kurrentdb-net
    driver: bridge
